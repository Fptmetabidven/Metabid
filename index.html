<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MetaBid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .page {
            width: 96%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 8px 0 40px;
        }

        /* ==========================
           HEADER
        ========================== */

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 2px;
        }

        .header h1 {
            margin: 0;
            color: #004d7e;
            font-size: 27px;
        }


        /* ==========================
           MESSAGES
        ========================== */

        #message {
            display: none;
            padding: 11px 14px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        #message.success {
            display: block;
            background: #e6f4ea;
            border: 1px solid #8bc79a;
            color: #176b2c;
        }

        #message.error {
            display: block;
            background: #fdeaea;
            border: 1px solid #e59a9a;
            color: #a31717;
        }

        #message.info {
            display: block;
            background: #eaf3fb;
            border: 1px solid #9abddc;
            color: #174f7c;
        }


        /* ==========================
           TABLE
        ========================== */

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .18);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #285f89;
            color: white;
        }

        th {
            padding: 10px 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 13px 10px;
            border-bottom: 1px solid #e7e7e7;
            vertical-align: middle;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .col-id {
            width: 70px;
            text-align: center;
        }

        .col-photo {
            width: 150px;
            text-align: center;
        }

        .col-description {
            min-width: 230px;
        }

        .col-weight {
            min-width: 120px;
        }

        .col-bid {
            min-width: 175px;
        }

        .col-vendor {
            min-width: 220px;
        }

        .col-action {
            width: 130px;
            text-align: center;
        }


        /* ==========================
           IMAGE
        ========================== */

        .item-photo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 5px;
            display: block;
            margin: auto;
        }

        .no-photo {
            width: 60px;
            height: 60px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
            color: #666;
            font-size: 11px;
        }


        /* ==========================
           INPUTS
        ========================== */

        .bid-box {
            display: flex;
            align-items: center;
            width: 150px;
            background: white;
            border: 1px solid #aab5bd;
            border-radius: 4px;
            overflow: hidden;
        }

        .bid-box:focus-within {
            border-color: #285f89;
            box-shadow: 0 0 0 2px rgba(40, 95, 137, .15);
        }

        .dollar {
            padding-left: 10px;
            font-weight: bold;
            color: #444;
        }

        .bid-input {
            width: 100%;
            border: none;
            outline: none;
            padding: 9px 8px;
            font-size: 14px;
            text-align: right;
            background: transparent;
        }

        .vendor-input {
            width: 100%;
            max-width: 240px;
            padding: 9px 10px;
            border: 1px solid #aab5bd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .vendor-input:focus {
            border-color: #285f89;
            box-shadow: 0 0 0 2px rgba(40, 95, 137, .15);
        }


        /* ==========================
           BUTTON
        ========================== */

        .save-button {
            min-width: 100px;
            padding: 9px 13px;
            border: none;
            border-radius: 4px;
            background: #285f89;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #1c4d72;
        }

        .save-button:disabled {
            opacity: .65;
            cursor: default;
        }

        .save-button.saved {
            background: #278044;
        }

        .save-button.failed {
            background: #b42318;
        }


        /* ==========================
           LOADING
        ========================== */

        .status-row td {
            text-align: center;
            padding: 35px;
            color: #555;
        }


        @media screen and (max-width: 800px) {

            .page {
                width: 99%;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- ==========================
         HEADER
    ========================== -->

    <div class="header">

        <img
            src="logo.png"
            class="logo"
            alt="MetaBid"
            onerror="this.style.display='none';"
        >

        <h1>MetaBid</h1>

    </div>


    <!-- ==========================
         MESSAGE AREA
    ========================== -->

    <div id="message"></div>


    <!-- ==========================
         INVENTORY TABLE
    ========================== -->

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th class="col-id">
                        ID
                    </th>

                    <th class="col-photo">
                        Photo
                    </th>

                    <th class="col-description">
                        Description
                    </th>

                    <th class="col-weight">
                        Weight
                    </th>

                    <th class="col-bid">
                        Bid Price
                    </th>

                    <th class="col-vendor">
                        Vendor Name
                    </th>

                    <th class="col-action">
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="inventoryBody">

                <tr class="status-row">

                    <td colspan="7">
                        Loading MetaBid inventory...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* ==========================================================
   POWER AUTOMATE

   Paste the URL from:

   "When an HTTP request is received"

   between the quotes.
========================================================== */

const FLOW_URL =
    "PASTE_YOUR_POWER_AUTOMATE_URL_HERE";


/* ==========================================================
   CALL POWER AUTOMATE
========================================================== */

async function callFlow(data) {

    if (
        !FLOW_URL ||
        FLOW_URL.includes("PASTE_YOUR")
    ) {

        throw new Error(
            "Power Automate URL has not been configured."
        );

    }


    /*
        text/plain is intentional.

        This usually avoids the browser performing
        an OPTIONS preflight request before sending
        the POST to Power Automate.
    */

    const response = await fetch(
        FLOW_URL,
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "text/plain;charset=UTF-8"

            },

            body:
                JSON.stringify(data)

        }
    );


    if (!response.ok) {

        throw new Error(
            "Power Automate returned HTTP " +
            response.status
        );

    }


    /*
        Some save responses might not contain JSON.
    */

    const responseText =
        await response.text();


    if (!responseText) {

        return {};

    }


    try {

        return JSON.parse(
            responseText
        );

    }
    catch {

        return {
            result: responseText
        };

    }

}


/* ==========================================================
   LOAD SHAREPOINT INVENTORY
========================================================== */

async function loadInventory() {

    const body =
        document.getElementById(
            "inventoryBody"
        );


    body.innerHTML = `

        <tr class="status-row">

            <td colspan="7">

                Loading MetaBid inventory...

            </td>

        </tr>

    `;


    try {


        /*
            Power Automate receives:

            {
                "action": "loadItems"
            }
        */

        const result =
            await callFlow({

                action:
                    "loadItems"

            });


        /*
            This supports several common Power Automate
            response formats.

            Option 1:
            {
                "items": [...]
            }

            Option 2:
            {
                "value": [...]
            }

            Option 3:
            [...]
        */

        let items = [];


        if (
            result &&
            Array.isArray(result.items)
        ) {

            items =
                result.items;

        }
        else if (
            result &&
            Array.isArray(result.value)
        ) {

            items =
                result.value;

        }
        else if (
            Array.isArray(result)
        ) {

            items =
                result;

        }


        renderInventory(
            items
        );


    }
    catch (error) {

        console.error(
            "Inventory load error:",
            error
        );


        body.innerHTML = `

            <tr class="status-row">

                <td colspan="7">

                    Unable to load inventory.

                </td>

            </tr>

        `;


        showMessage(
            "Could not load the MetaBid inventory.",
            "error"
        );

    }

}


/* ==========================================================
   GET FIELD

   Allows different SharePoint / Power Automate names.
========================================================== */

function getField(
    item,
    possibleNames,
    fallback = ""
) {

    for (
        const name
        of possibleNames
    ) {

        if (
            Object.prototype.hasOwnProperty.call(
                item,
                name
            ) &&
            item[name] !== null &&
            item[name] !== undefined
        ) {

            return item[name];

        }

    }


    return fallback;

}


/* ==========================================================
   RENDER INVENTORY
========================================================== */

function renderInventory(items) {

    const body =
        document.getElementById(
            "inventoryBody"
        );


    body.innerHTML =
        "";


    if (
        !items ||
        items.length === 0
    ) {

        body.innerHTML = `

            <tr class="status-row">

                <td colspan="7">

                    No inventory items are currently available.

                </td>

            </tr>

        `;

        return;

    }


    items.forEach(
        function(item) {


            /* ==========================
               ID
            ========================== */

            const itemId =
                getField(
                    item,
                    [
                        "ID",
                        "Id",
                        "id",
                        "itemId",
                        "ItemID"
                    ]
                );


            /* ==========================
               DESCRIPTION
            ========================== */

            const description =
                getField(
                    item,
                    [
                        "Description",
                        "description",
                        "Title",
                        "title"
                    ]
                );


            /* ==========================
               WEIGHT
            ========================== */

            const weight =
                getField(
                    item,
                    [
                        "Weight",
                        "weight"
                    ]
                );


            /* ==========================
               BID PRICE
            ========================== */

            const bid =
                getField(
                    item,
                    [
                        "BidPrice",
                        "Bid Price",
                        "bidPrice",
                        "Bid",
                        "bid"
                    ],
                    ""
                );


            /* ==========================
               VENDOR
            ========================== */

            const vendor =
                getField(
                    item,
                    [
                        "VendorName",
                        "Vendor Name",
                        "vendorName",
                        "Vendor",
                        "vendor"
                    ],
                    ""
                );


            /* ==========================
               PHOTO
            ========================== */

            let photo =
                getField(
                    item,
                    [
                        "PhotoURL",
                        "PhotoUrl",
                        "photoUrl",
                        "photo",
                        "Photo",
                        "Image",
                        "image"
                    ],
                    ""
                );


            /*
                Sometimes SharePoint image columns
                return an object instead of a string.

                Example:

                {
                    "serverUrl": "...",
                    "serverRelativeUrl": "..."
                }
            */

            if (
                photo &&
                typeof photo === "object"
            ) {

                if (photo.url) {

                    photo =
                        photo.url;

                }
                else if (photo.Url) {

                    photo =
                        photo.Url;

                }
                else if (
                    photo.serverUrl &&
                    photo.serverRelativeUrl
                ) {

                    photo =
                        photo.serverUrl +
                        photo.serverRelativeUrl;

                }
                else {

                    photo =
                        "";

                }

            }


            /* ==========================
               ROW
            ========================== */

            const row =
                document.createElement(
                    "tr"
                );


            /* --------------------------
               ID
            -------------------------- */

            const idCell =
                document.createElement(
                    "td"
                );

            idCell.className =
                "col-id";

            idCell.textContent =
                itemId;

            row.appendChild(
                idCell
            );


            /* --------------------------
               PHOTO
            -------------------------- */

            const photoCell =
                document.createElement(
                    "td"
                );

            photoCell.className =
                "col-photo";


            if (photo) {

                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "item-photo";

                img.src =
                    photo;

                img.alt =
                    "Item " + itemId;


                img.onerror =
                    function() {

                        photoCell.innerHTML =
                            "";

                        const missing =
                            document.createElement(
                                "div"
                            );

                        missing.className =
                            "no-photo";

                        missing.textContent =
                            "No Photo";

                        photoCell.appendChild(
                            missing
                        );

                    };


                photoCell.appendChild(
                    img
                );

            }
            else {

                const missing =
                    document.createElement(
                        "div"
                    );

                missing.className =
                    "no-photo";

                missing.textContent =
                    "No Photo";

                photoCell.appendChild(
                    missing
                );

            }


            row.appendChild(
                photoCell
            );


            /* --------------------------
               DESCRIPTION
            -------------------------- */

            const descCell =
                document.createElement(
                    "td"
                );

            descCell.className =
                "col-description";

            descCell.textContent =
                description;

            row.appendChild(
                descCell
            );


            /* --------------------------
               WEIGHT
            -------------------------- */

            const weightCell =
                document.createElement(
                    "td"
                );

            weightCell.className =
                "col-weight";

            weightCell.textContent =
                weight;

            row.appendChild(
                weightCell
            );


            /* --------------------------
               BID INPUT
            -------------------------- */

            const bidCell =
                document.createElement(
                    "td"
                );

            bidCell.className =
                "col-bid";


            const bidBox =
                document.createElement(
                    "div"
                );

            bidBox.className =
                "bid-box";


            const dollar =
                document.createElement(
                    "span"
                );

            dollar.className =
                "dollar";

            dollar.textContent =
                "$";


            const bidInput =
                document.createElement(
                    "input"
                );

            bidInput.type =
                "number";

            bidInput.className =
                "bid-input";

            bidInput.id =
                "bid-" + itemId;

            bidInput.min =
                "0";

            bidInput.step =
                "0.01";

            bidInput.placeholder =
                "0.00";


            if (
                bid !== "" &&
                bid !== null
            ) {

                const cleanBid =
                    String(bid)
                        .replace(/\$/g, "")
                        .replace(/,/g, "")
                        .trim();


                if (
                    cleanBid !== "" &&
                    !isNaN(
                        Number(cleanBid)
                    )
                ) {

                    bidInput.value =
                        Number(cleanBid);

                }

            }


            bidBox.appendChild(
                dollar
            );

            bidBox.appendChild(
                bidInput
            );

            bidCell.appendChild(
                bidBox
            );

            row.appendChild(
                bidCell
            );


            /* --------------------------
               VENDOR INPUT
            -------------------------- */

            const vendorCell =
                document.createElement(
                    "td"
                );

            vendorCell.className =
                "col-vendor";


            const vendorInput =
                document.createElement(
                    "input"
                );

            vendorInput.type =
                "text";

            vendorInput.className =
                "vendor-input";

            vendorInput.id =
                "vendor-" + itemId;

            vendorInput.placeholder =
                "Enter vendor name";

            vendorInput.maxLength =
                150;

            vendorInput.value =
                vendor;


            vendorCell.appendChild(
                vendorInput
            );

            row.appendChild(
                vendorCell
            );


            /* --------------------------
               SAVE BUTTON
            -------------------------- */

            const actionCell =
                document.createElement(
                    "td"
                );

            actionCell.className =
                "col-action";


            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "save-button";

            button.textContent =
                "Save Bid";


            button.addEventListener(
                "click",
                function() {

                    saveBid(
                        itemId,
                        button
                    );

                }
            );


            actionCell.appendChild(
                button
            );

            row.appendChild(
                actionCell
            );


            body.appendChild(
                row
            );

        }
    );

}


/* ==========================================================
   SAVE BID
========================================================== */

async function saveBid(
    itemId,
    button
) {

    const bidInput =
        document.getElementById(
            "bid-" + itemId
        );


    const vendorInput =
        document.getElementById(
            "vendor-" + itemId
        );


    const vendorName =
        vendorInput.value.trim();


    const bidText =
        bidInput.value.trim();


    /* ==========================
       VALIDATE VENDOR
    ========================== */

    if (!vendorName) {

        showMessage(
            "Please enter the vendor name.",
            "error"
        );

        vendorInput.focus();

        return;

    }


    /* ==========================
       VALIDATE BID
    ========================== */

    if (!bidText) {

        showMessage(
            "Please enter a bid price.",
            "error"
        );

        bidInput.focus();

        return;

    }


    const bidPrice =
        Number(
            bidText
        );


    if (
        !Number.isFinite(
            bidPrice
        ) ||
        bidPrice < 0
    ) {

        showMessage(
            "Please enter a valid bid price.",
            "error"
        );

        bidInput.focus();

        return;

    }


    /* ==========================
       BUTTON SAVING STATE
    ========================== */

    button.disabled =
        true;

    button.classList.remove(
        "saved",
        "failed"
    );

    button.textContent =
        "Saving...";


    showMessage(
        "Saving bid for item " +
        itemId +
        "...",
        "info"
    );


    try {


        /*
            This is all that GitHub sends.

            It does NOT send description,
            weight, photo, etc.
        */

        const result =
            await callFlow({

                action:
                    "saveBid",

                itemId:
                    String(itemId),

                vendorName:
                    vendorName,

                bidPrice:
                    bidPrice

            });


        /*
            Optional Power Automate response:

            {
                "success": true
            }
        */

        if (
            result &&
            result.success === false
        ) {

            throw new Error(
                result.message ||
                "Power Automate reported an error."
            );

        }


        button.disabled =
            false;

        button.classList.add(
            "saved"
        );

        button.textContent =
            "Saved ✓";


        showMessage(
            "Bid saved successfully for item " +
            itemId +
            ".",
            "success"
        );


        setTimeout(
            function() {

                button.classList.remove(
                    "saved"
                );

                button.textContent =
                    "Save Bid";

            },
            2500
        );


    }
    catch (error) {

        console.error(
            "Bid save error:",
            error
        );


        button.disabled =
            false;

        button.classList.add(
            "failed"
        );

        button.textContent =
            "Try Again";


        showMessage(
            "The bid could not be saved. Please try again.",
            "error"
        );

    }

}


/* ==========================================================
   MESSAGE
========================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        type;

    message.textContent =
        text;

    message.style.display =
        "block";


    if (
        type === "success"
    ) {

        setTimeout(
            function() {

                message.style.display =
                    "none";

            },
            4000
        );

    }

}


/* ==========================================================
   START
========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadInventory
);

</script>

</body>

</html>
