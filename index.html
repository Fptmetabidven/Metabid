<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MetaBid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .page {
            width: 94%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 12px 0 40px;
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
            margin: 0 auto 2px;
        }

        h1 {
            margin: 0;
            color: #005080;
            font-size: 28px;
        }


        /* ==============================
           STATUS
        ============================== */

        #status {
            display: none;
            margin-bottom: 10px;
            padding: 12px 14px;
            border-radius: 4px;
            font-weight: bold;
        }

        #status.error {
            display: block;
            background: #fdeaea;
            border: 1px solid #e39090;
            color: #a00000;
        }

        #status.info {
            display: block;
            background: #eaf3fa;
            border: 1px solid #98bdd7;
            color: #174f7c;
        }


        /* ==============================
           TABLE
        ============================== */

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,.18);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #28638f;
            color: white;
        }

        th {
            text-align: left;
            padding: 11px 12px;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #e7e7e7;
            vertical-align: middle;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f9fbfc;
        }


        /* ==============================
           COLUMNS
        ============================== */

        .id-col {
            width: 70px;
            text-align: center;
        }

        .photo-col {
            width: 140px;
            text-align: center;
        }

        .description-col {
            min-width: 260px;
        }

        .weight-col {
            min-width: 130px;
        }

        .bid-col {
            min-width: 150px;
        }

        .vendor-col {
            min-width: 220px;
        }


        /* ==============================
           PHOTO
        ============================== */

        .item-photo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 5px;
            display: block;
            margin: auto;
        }

        .no-photo {
            width: 70px;
            height: 70px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eeeeee;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 11px;
            color: #666;
        }


        /* ==============================
           LOADING
        ============================== */

        .message-row td {
            text-align: center;
            padding: 35px;
            color: #555;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media screen and (max-width: 800px) {

            .page {
                width: 98%;
            }

            th,
            td {
                padding: 8px;
            }

            .item-photo,
            .no-photo {
                width: 55px;
                height: 55px;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- ==============================
         HEADER
    ============================== -->

    <div class="header">

        <img
            src="logo.png"
            class="logo"
            alt="MetaBid"
            onerror="this.style.display='none'"
        >

        <h1>MetaBid</h1>

    </div>


    <!-- ==============================
         STATUS
    ============================== -->

    <div id="status"></div>


    <!-- ==============================
         TABLE
    ============================== -->

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th class="id-col">
                        ID
                    </th>

                    <th class="photo-col">
                        Photo
                    </th>

                    <th class="description-col">
                        Description
                    </th>

                    <th class="weight-col">
                        Weight
                    </th>

                    <th class="bid-col">
                        Bid Price
                    </th>

                    <th class="vendor-col">
                        Vendor Name
                    </th>

                </tr>

            </thead>


            <tbody id="inventoryBody">

                <tr class="message-row">

                    <td colspan="6">
                        Loading MetaBid inventory...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* ==========================================================
   META BID DATA FILE

   This is generated automatically by GitHub Actions
   from the SharePoint data sent by Power Automate.
========================================================== */

const DATA_FILE = "./data/items.json";


/* ==========================================================
   LOAD INVENTORY
========================================================== */

async function loadInventory() {

    const body =
        document.getElementById("inventoryBody");


    try {

        /*
            Date.now() prevents the browser from
            holding onto an old cached items.json file.
        */

        const response =
            await fetch(
                DATA_FILE + "?v=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load " +
                DATA_FILE +
                ". HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
            Your GitHub Action currently writes:

            [
                {...},
                {...}
            ]

            This also supports:

            {
                "items": [...]
            }
        */

        let items = [];


        if (Array.isArray(data)) {

            items = data;

        }
        else if (
            data &&
            Array.isArray(data.items)
        ) {

            items = data.items;

        }
        else {

            throw new Error(
                "items.json is not in the expected format."
            );

        }


        renderInventory(items);

    }
    catch (error) {

        console.error(error);


        body.innerHTML = `

            <tr class="message-row">

                <td colspan="6">
                    Unable to load inventory.
                </td>

            </tr>

        `;


        showError(
            "Could not load the MetaBid inventory."
        );

    }

}


/* ==========================================================
   FIELD HELPER

   Allows several possible field names.
========================================================== */

function getField(
    item,
    names,
    fallback = ""
) {

    for (const name of names) {

        if (
            Object.prototype.hasOwnProperty.call(
                item,
                name
            ) &&
            item[name] !== null &&
            item[name] !== undefined
        ) {

            return item[name];

        }

    }

    return fallback;

}


/* ==========================================================
   RENDER INVENTORY
========================================================== */

function renderInventory(items) {

    const body =
        document.getElementById(
            "inventoryBody"
        );


    body.innerHTML =
        "";


    if (!items.length) {

        body.innerHTML = `

            <tr class="message-row">

                <td colspan="6">
                    No MetaBid inventory items found.
                </td>

            </tr>

        `;

        return;

    }


    items.forEach(function(item) {


        /* ==============================
           VALUES
        ============================== */

        const id =
            getField(
                item,
                [
                    "id",
                    "ID",
                    "Id",
                    "itemId"
                ]
            );


        const description =
            getField(
                item,
                [
                    "description",
                    "Description",
                    "title",
                    "Title"
                ]
            );


        const weight =
            getField(
                item,
                [
                    "weight",
                    "Weight"
                ]
            );


        const bidPrice =
            getField(
                item,
                [
                    "bidPrice",
                    "BidPrice",
                    "Bid Price",
                    "bid",
                    "Bid"
                ]
            );


        const vendorName =
            getField(
                item,
                [
                    "vendorName",
                    "VendorName",
                    "Vendor Name",
                    "vendor",
                    "Vendor"
                ]
            );


        const photo =
            getField(
                item,
                [
                    "photo",
                    "Photo",
                    "photoUrl",
                    "PhotoURL",
                    "image",
                    "Image"
                ]
            );


        /* ==============================
           ROW
        ============================== */

        const row =
            document.createElement(
                "tr"
            );


        /* ------------------------------
           ID
        ------------------------------ */

        const idCell =
            document.createElement(
                "td"
            );

        idCell.className =
            "id-col";

        idCell.textContent =
            id;

        row.appendChild(
            idCell
        );


        /* ------------------------------
           PHOTO
        ------------------------------ */

        const photoCell =
            document.createElement(
                "td"
            );

        photoCell.className =
            "photo-col";


        if (photo) {

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "item-photo";

            img.src =
                photo;

            img.alt =
                "Item " + id;


            img.onerror =
                function() {

                    photoCell.innerHTML =
                        "";

                    addNoPhoto(
                        photoCell
                    );

                };


            photoCell.appendChild(
                img
            );

        }
        else {

            addNoPhoto(
                photoCell
            );

        }


        row.appendChild(
            photoCell
        );


        /* ------------------------------
           DESCRIPTION
        ------------------------------ */

        const descriptionCell =
            document.createElement(
                "td"
            );

        descriptionCell.className =
            "description-col";

        descriptionCell.textContent =
            description;

        row.appendChild(
            descriptionCell
        );


        /* ------------------------------
           WEIGHT
        ------------------------------ */

        const weightCell =
            document.createElement(
                "td"
            );

        weightCell.className =
            "weight-col";

        weightCell.textContent =
            weight;

        row.appendChild(
            weightCell
        );


        /* ------------------------------
           BID PRICE
        ------------------------------ */

        const bidCell =
            document.createElement(
                "td"
            );

        bidCell.className =
            "bid-col";


        if (
            bidPrice !== "" &&
            bidPrice !== null
        ) {

            const numericBid =
                Number(
                    String(bidPrice)
                        .replace(/\$/g, "")
                        .replace(/,/g, "")
                );


            if (
                Number.isFinite(
                    numericBid
                )
            ) {

                bidCell.textContent =
                    numericBid.toLocaleString(
                        "en-US",
                        {
                            style:
                                "currency",

                            currency:
                                "USD"
                        }
                    );

            }
            else {

                bidCell.textContent =
                    bidPrice;

            }

        }
        else {

            bidCell.textContent =
                "";

        }


        row.appendChild(
            bidCell
        );


        /* ------------------------------
           VENDOR
        ------------------------------ */

        const vendorCell =
            document.createElement(
                "td"
            );

        vendorCell.className =
            "vendor-col";

        vendorCell.textContent =
            vendorName;

        row.appendChild(
            vendorCell
        );


        body.appendChild(
            row
        );

    });

}


/* ==========================================================
   NO PHOTO
========================================================== */

function addNoPhoto(cell) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "no-photo";

    div.textContent =
        "No Photo";

    cell.appendChild(
        div
    );

}


/* ==========================================================
   ERROR
========================================================== */

function showError(text) {

    const status =
        document.getElementById(
            "status"
        );

    status.className =
        "error";

    status.textContent =
        text;

}


/* ==========================================================
   START
========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadInventory
);

</script>

</body>

</html>
