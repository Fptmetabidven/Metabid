name: MetaBid SharePoint Update

on:
  repository_dispatch:
    types:
      - metabid_update
      - metabid_photo_chunk
      - metabid_remove

permissions:
  contents: write

jobs:

  update-metabid:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # PROCESS EVENT
      # ======================================================

      - name: Process MetaBid event

        env:

          EVENT_TYPE: ${{ github.event.action }}

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          DESCRIPTION: ${{ github.event.client_payload.description }}

          WEIGHT: ${{ github.event.client_payload.weight }}

          BID_PRICE: ${{ github.event.client_payload.bidPrice }}

          VENDOR_NAME: ${{ github.event.client_payload.vendorName }}

          VENDOR_EMAIL: ${{ github.event.client_payload.vendorEmail }}

          VENDOR_NOTES: ${{ github.event.client_payload.vendorNotes }}

          PHOTO_FILENAME: ${{ github.event.client_payload.photoFileName }}

          PHOTO_CHUNK_COUNT: ${{ github.event.client_payload.photoChunkCount }}

          CHUNK_INDEX: ${{ github.event.client_payload.chunkIndex }}

          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}

          CHUNK_DATA: ${{ github.event.client_payload.chunkData }}

        run: |

          python3 <<'PY'

          import os
          import json
          import base64
          import shutil
          from pathlib import Path


          # ==================================================
          # EVENT INFORMATION
          # ==================================================

          event_type = os.environ.get(
              "EVENT_TYPE",
              ""
          ).strip()


          item_id = os.environ.get(
              "ITEM_ID",
              ""
          ).strip()


          if not item_id:

              raise SystemExit(
                  "No itemId received."
              )


          print(
              "Event:",
              event_type
          )


          print(
              "Item:",
              item_id
          )


          # ==================================================
          # FOLDERS
          # ==================================================

          data_folder = Path(
              "data"
          )


          images_folder = Path(
              "images"
          )


          chunk_root = Path(
              ".metabid_chunks"
          )


          data_folder.mkdir(
              exist_ok=True
          )


          images_folder.mkdir(
              exist_ok=True
          )


          chunk_root.mkdir(
              exist_ok=True
          )


          data_file = (
              data_folder /
              "items.json"
          )


          # ==================================================
          # LOAD INVENTORY
          # ==================================================

          if data_file.exists():

              try:

                  items = json.loads(

                      data_file.read_text(
                          encoding="utf-8"
                      )

                  )

              except Exception:

                  items = []

          else:

              items = []


          if not isinstance(
              items,
              list
          ):

              items = []


          # ==================================================
          # ITEM UPDATE
          # ==================================================

          if event_type == "metabid_update":


              description = os.environ.get(
                  "DESCRIPTION",
                  ""
              )


              weight = os.environ.get(
                  "WEIGHT",
                  ""
              )


              bid_price = os.environ.get(
                  "BID_PRICE",
                  ""
              )


              vendor_name = os.environ.get(
                  "VENDOR_NAME",
                  ""
              )


              vendor_email = os.environ.get(
                  "VENDOR_EMAIL",
                  ""
              )


              vendor_notes = os.environ.get(
                  "VENDOR_NOTES",
                  ""
              )


              existing_photo = ""


              for item in items:

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) == item_id:

                      existing_photo = item.get(
                          "photo",
                          ""
                      )

                      break


              new_item = {

                  "id":
                      item_id,

                  "description":
                      description,

                  "weight":
                      weight,

                  "bidPrice":
                      bid_price,

                  "vendorName":
                      vendor_name,

                  "vendorEmail":
                      vendor_email,

                  "vendorNotes":
                      vendor_notes,

                  "photo":
                      existing_photo

              }


              found = False


              for index, item in enumerate(
                  items
              ):

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) == item_id:

                      items[index] = (
                          new_item
                      )

                      found = True

                      break


              if not found:

                  items.append(
                      new_item
                  )


              def sort_key(item):

                  value = str(
                      item.get(
                          "id",
                          ""
                      )
                  )


                  if value.isdigit():

                      return int(
                          value
                      )


                  return 999999999


              items.sort(
                  key=sort_key
              )


              data_file.write_text(

                  json.dumps(
                      items,
                      indent=2
                  ),

                  encoding="utf-8"

              )


              print(
                  "Item data updated."
              )


          # ==================================================
          # PHOTO CHUNK
          # ==================================================

          elif event_type == "metabid_photo_chunk":


              chunk_index_text = os.environ.get(
                  "CHUNK_INDEX",
                  ""
              ).strip()


              chunk_count_text = os.environ.get(
                  "CHUNK_COUNT",
                  ""
              ).strip()


              chunk_data = os.environ.get(
                  "CHUNK_DATA",
                  ""
              ).strip()


              photo_filename = os.environ.get(
                  "PHOTO_FILENAME",
                  ""
              ).strip()


              if chunk_index_text == "":

                  raise SystemExit(
                      "No chunkIndex received."
                  )


              if chunk_count_text == "":

                  raise SystemExit(
                      "No chunkCount received."
                  )


              if not chunk_data:

                  raise SystemExit(
                      "No chunkData received."
                  )


              chunk_index = int(
                  chunk_index_text
              )


              chunk_count = int(
                  chunk_count_text
              )


              item_chunk_folder = (

                  chunk_root /
                  item_id

              )


              item_chunk_folder.mkdir(
                  parents=True,
                  exist_ok=True
              )


              # ==============================================
              # SAVE PHOTO FILENAME
              # ==============================================

              if photo_filename:

                  (
                      item_chunk_folder /
                      "filename.txt"
                  ).write_text(

                      photo_filename,

                      encoding="utf-8"

                  )


              # ==============================================
              # SAVE CURRENT CHUNK
              # ==============================================

              chunk_file = (

                  item_chunk_folder /
                  f"{chunk_index:06d}.txt"

              )


              chunk_file.write_text(

                  chunk_data,

                  encoding="utf-8"

              )


              print(
                  "Saved chunk",
                  chunk_index + 1,
                  "of",
                  chunk_count
              )


              # ==============================================
              # CHECK WHETHER ALL CHUNKS EXIST
              # ==============================================

              expected_names = [

                  f"{index:06d}.txt"

                  for index in range(
                      chunk_count
                  )

              ]


              all_present = all(

                  (
                      item_chunk_folder /
                      name
                  ).exists()

                  for name in expected_names

              )


              if not all_present:

                  actual_chunks = [

                      file

                      for file in
                      item_chunk_folder.glob(
                          "*.txt"
                      )

                      if file.name !=
                      "filename.txt"

                  ]


                  print(

                      "Waiting for remaining chunks.",

                      len(actual_chunks),

                      "of",

                      chunk_count,

                      "received."

                  )


              else:

                  print(
                      "All photo chunks received."
                  )


                  # ==========================================
                  # ASSEMBLE BASE64
                  # ==========================================

                  complete_base64 = ""


                  for index in range(
                      chunk_count
                  ):

                      complete_base64 += (

                          item_chunk_folder /
                          f"{index:06d}.txt"

                      ).read_text(
                          encoding="utf-8"
                      ).strip()


                  # ==========================================
                  # DETERMINE IMAGE TYPE
                  # ==========================================

                  filename_file = (

                      item_chunk_folder /
                      "filename.txt"

                  )


                  if filename_file.exists():

                      saved_filename = (

                          filename_file.read_text(
                              encoding="utf-8"
                          ).strip()

                      )

                  else:

                      saved_filename = (
                          photo_filename
                      )


                  extension = Path(
                      saved_filename
                  ).suffix.lower()


                  if extension not in [

                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".gif",
                      ".webp"

                  ]:

                      extension = ".jpg"


                  # ==========================================
                  # REMOVE PREVIOUS IMAGE
                  # ==========================================

                  for old_image in (
                      images_folder.glob(
                          f"{item_id}.*"
                      )
                  ):

                      old_image.unlink()


                  # ==========================================
                  # DECODE IMAGE
                  # ==========================================

                  image_file = (

                      images_folder /
                      f"{item_id}{extension}"

                  )


                  try:

                      image_bytes = (
                          base64.b64decode(
                              complete_base64,
                              validate=False
                          )
                      )

                  except Exception as error:

                      raise SystemExit(

                          f"Could not decode image: {error}"

                      )


                  image_file.write_bytes(
                      image_bytes
                  )


                  photo_path = (

                      f"images/"
                      f"{item_id}"
                      f"{extension}"

                  )


                  print(
                      "Photo saved:",
                      photo_path
                  )


                  # ==========================================
                  # RELOAD INVENTORY
                  # ==========================================

                  if data_file.exists():

                      try:

                          items = json.loads(

                              data_file.read_text(
                                  encoding="utf-8"
                              )

                          )

                      except Exception:

                          items = []

                  else:

                      items = []


                  if not isinstance(
                      items,
                      list
                  ):

                      items = []


                  # ==========================================
                  # UPDATE PHOTO PATH
                  # ==========================================

                  found = False


                  for item in items:

                      if str(
                          item.get(
                              "id",
                              ""
                          )
                      ) == item_id:

                          item["photo"] = (
                              photo_path
                          )

                          found = True

                          break


                  if not found:

                      items.append({

                          "id":
                              item_id,

                          "description":
                              "",

                          "weight":
                              "",

                          "bidPrice":
                              "",

                          "vendorName":
                              "",

                          "vendorEmail":
                              "",

                          "vendorNotes":
                              "",

                          "photo":
                              photo_path

                      })


                  def sort_key(item):

                      value = str(
                          item.get(
                              "id",
                              ""
                          )
                      )


                      if value.isdigit():

                          return int(
                              value
                          )


                      return 999999999


                  items.sort(
                      key=sort_key
                  )


                  data_file.write_text(

                      json.dumps(
                          items,
                          indent=2
                      ),

                      encoding="utf-8"

                  )


                  # ==========================================
                  # DELETE TEMP CHUNKS
                  # ==========================================

                  shutil.rmtree(
                      item_chunk_folder
                  )


                  print(
                      "Photo assembly complete."
                  )


          # ==================================================
          # REMOVE CLOSED ITEM
          # ==================================================

          elif event_type == "metabid_remove":


              items = [

                  item

                  for item in items

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) != item_id

              ]


              data_file.write_text(

                  json.dumps(
                      items,
                      indent=2
                  ),

                  encoding="utf-8"

              )


              for old_image in (
                  images_folder.glob(
                      f"{item_id}.*"
                  )
              ):

                  old_image.unlink()


              item_chunk_folder = (

                  chunk_root /
                  item_id

              )


              if item_chunk_folder.exists():

                  shutil.rmtree(
                      item_chunk_folder
                  )


              print(
                  "Removed MetaBid item:",
                  item_id
              )


          else:

              raise SystemExit(

                  f"Unknown event: {event_type}"

              )


          PY


      # ======================================================
      # COMMIT / PUSH
      # ======================================================

      - name: Commit MetaBid changes

        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          EVENT_TYPE: ${{ github.event.action }}

        run: |

          git config user.name \
            "MetaBid Automation"


          git config user.email \
            "actions@github.com"


          git add -A


          if git diff --cached --quiet
          then

            echo "No changes to commit."

            exit 0

          fi


          git commit \
            -m "MetaBid ${EVENT_TYPE} item ${ITEM_ID}"


          for attempt in 1 2 3 4 5
          do

            echo \
              "Push attempt ${attempt}"


            if git pull \
              --rebase \
              origin \
              main
            then

              if git push \
                origin \
                HEAD:main
              then

                echo "Push successful."

                exit 0

              fi

            else

              git rebase --abort || true

            fi


            sleep 2

          done


          echo "Unable to push changes."

          exit 1
