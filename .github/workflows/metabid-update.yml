name: MetaBid SharePoint Update

on:
  repository_dispatch:
    types: [metabid_update]

permissions:
  contents: write

# Prevent two SharePoint updates from trying to write to main at the same time
concurrency:
  group: metabid-main-updates
  cancel-in-progress: false

jobs:
  update-metabid:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. CHECK OUT REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. MAKE SURE WE HAVE THE LATEST MAIN
      # ---------------------------------------------------------
      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      # ---------------------------------------------------------
      # 3. CREATE DATA FOLDER IF IT DOES NOT EXIST
      # ---------------------------------------------------------
      - name: Create data folder
        run: |
          mkdir -p data

      # ---------------------------------------------------------
      # 4. UPDATE ITEMS.JSON
      # ---------------------------------------------------------
      - name: Update MetaBid inventory
        env:
          ITEM_ID: ${{ github.event.client_payload.itemId }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          WEIGHT: ${{ github.event.client_payload.weight }}
          BID_PRICE: ${{ github.event.client_payload.bidPrice }}
          VENDOR_NAME: ${{ github.event.client_payload.vendorName }}
          PHOTO_FILE_NAME: ${{ github.event.client_payload.photoFileName }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          file_path = Path("data/items.json")

          # -----------------------------------------------------
          # Load existing items
          # -----------------------------------------------------
          if file_path.exists():
              try:
                  items = json.loads(
                      file_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  items = []
          else:
              items = []

          # Make sure data is a list
          if isinstance(items, dict):
              if "items" in items and isinstance(items["items"], list):
                  items = items["items"]
              else:
                  items = []

          if not isinstance(items, list):
              items = []

          # -----------------------------------------------------
          # Read SharePoint / Power Automate values
          # -----------------------------------------------------
          item_id = os.environ.get("ITEM_ID", "").strip()
          description = os.environ.get("DESCRIPTION", "")
          weight = os.environ.get("WEIGHT", "")
          bid_price = os.environ.get("BID_PRICE", "")
          vendor_name = os.environ.get("VENDOR_NAME", "")
          photo_file_name = os.environ.get("PHOTO_FILE_NAME", "")

          print(f"Processing MetaBid item: {item_id}")
          print(f"Description: {description}")
          print(f"Weight: {weight}")
          print(f"Bid Price: {bid_price}")
          print(f"Vendor Name: {vendor_name}")
          print(f"Photo File Name: {photo_file_name}")

          # -----------------------------------------------------
          # Build updated item
          # -----------------------------------------------------
          new_item = {
              "id": item_id,
              "description": description,
              "weight": weight,
              "bidPrice": bid_price,
              "vendorName": vendor_name,
              "photoFileName": photo_file_name
          }

          # -----------------------------------------------------
          # Preserve existing photo path if one already exists
          # -----------------------------------------------------
          updated = False

          for index, existing in enumerate(items):
              if str(existing.get("id", "")).strip() == item_id:

                  # Keep existing photo URL/path if already stored
                  existing_photo = existing.get("photo", "")

                  items[index] = new_item

                  if existing_photo:
                      items[index]["photo"] = existing_photo

                  updated = True
                  print(f"Updated existing item {item_id}")
                  break

          # -----------------------------------------------------
          # If item does not exist, add it
          # -----------------------------------------------------
          if not updated:
              items.append(new_item)
              print(f"Added new item {item_id}")

          # -----------------------------------------------------
          # Sort by SharePoint item ID
          # -----------------------------------------------------
          def sort_key(record):
              value = str(record.get("id", "")).strip()

              if value.isdigit():
                  return (0, int(value))

              return (1, value)

          items.sort(key=sort_key)

          # -----------------------------------------------------
          # Save items.json
          # -----------------------------------------------------
          file_path.write_text(
              json.dumps(items, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print(f"Successfully wrote {file_path}")
          PY

      # ---------------------------------------------------------
      # 5. COMMIT AND PUSH
      # ---------------------------------------------------------
      - name: Commit MetaBid update
        run: |
          git config user.name "MetaBid Automation"
          git config user.email "actions@github.com"

          git add data/items.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MetaBid item ${{ github.event.client_payload.itemId }}"

          git push origin main
