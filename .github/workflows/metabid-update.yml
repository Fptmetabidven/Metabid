name: MetaBid SharePoint Update

on:
  repository_dispatch:
    types:
      - metabid_update
      - metabid_photo_chunk
      - metabid_remove

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: metabid-inventory-write
  queue: max

jobs:
  update-metabid:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      # ======================================================
      # PROCESS EVENT
      # ======================================================

      - name: Process MetaBid event
        id: process_event
        env:
          EVENT_TYPE: ${{ github.event.action }}
          ITEM_ID: ${{ github.event.client_payload.itemId }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          WEIGHT: ${{ github.event.client_payload.weight }}
          FPT_NOTES: ${{ github.event.client_payload.fptNotes }}
          CURRENT_PRICE: ${{ github.event.client_payload.currentPrice }}

          PHOTO_FILENAME: ${{ github.event.client_payload.photoFileName }}
          PHOTO_SOURCE_NAME: ${{ github.event.client_payload.photoFileName }}
          PHOTO_CHUNK_COUNT: ${{ github.event.client_payload.photoChunkCount }}

          CHUNK_INDEX: ${{ github.event.client_payload.chunkIndex }}
          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}
          CHUNK_DATA: ${{ github.event.client_payload.chunkData }}

        run: |
          python3 <<'PY'
          import os
          import json
          import base64
          import shutil
          from pathlib import Path


          # ==================================================
          # HELPERS
          # ==================================================

          def set_step_output(name, value):
              output_file = os.environ.get("GITHUB_OUTPUT", "")
              if output_file:
                  safe_value = str(value).replace("\r", " ").replace("\n", " ")
                  with open(output_file, "a", encoding="utf-8") as handle:
                      handle.write(f"{name}={safe_value}\n")


          def set_deploy_pages(value):
              set_step_output(
                  "deploy_pages",
                  "true" if value else "false"
              )


          def load_items(data_file):
              if not data_file.exists():
                  return []

              try:
                  loaded = json.loads(
                      data_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  return []

              if not isinstance(loaded, list):
                  return []

              return loaded


          def save_items(data_file, items):
              data_file.write_text(
                  json.dumps(
                      items,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def sort_items(items):
              def sort_key(item):
                  value = str(
                      item.get(
                          "id",
                          ""
                      )
                  )

                  if value.isdigit():
                      return int(value)

                  return 999999999

              items.sort(
                  key=sort_key
              )


          def find_existing_image(images_folder, item_id):
              allowed_extensions = {
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".gif",
                  ".webp"
              }

              matches = [
                  path
                  for path in images_folder.glob(
                      f"{item_id}.*"
                  )
                  if path.is_file()
                  and path.suffix.lower() in allowed_extensions
              ]

              if not matches:
                  return None

              matches.sort(
                  key=lambda path: path.stat().st_mtime,
                  reverse=True
              )

              return matches[0]


          # ==================================================
          # EVENT INFORMATION
          # ==================================================

          event_type = os.environ.get(
              "EVENT_TYPE",
              ""
          ).strip()

          item_id = os.environ.get(
              "ITEM_ID",
              ""
          ).strip()

          if not item_id:
              raise SystemExit(
                  "No itemId received."
              )

          print(
              "Event:",
              event_type
          )

          print(
              "Item:",
              item_id
          )


          # ==================================================
          # DEFAULT OUTPUTS
          # ==================================================

          set_deploy_pages(False)

          set_step_output(
              "photo_completed",
              "false"
          )

          set_step_output(
              "photo_filename",
              ""
          )


          # ==================================================
          # FOLDERS
          # ==================================================

          data_folder = Path(
              "data"
          )

          images_folder = Path(
              "images"
          )

          chunk_root = Path(
              ".metabid_chunks"
          )

          data_folder.mkdir(
              exist_ok=True
          )

          images_folder.mkdir(
              exist_ok=True
          )

          chunk_root.mkdir(
              exist_ok=True
          )

          data_file = (
              data_folder /
              "items.json"
          )


          # ==================================================
          # LOAD INVENTORY
          # ==================================================

          items = load_items(
              data_file
          )


          # ==================================================
          # NORMAL ITEM UPDATE
          # ==================================================

          if event_type == "metabid_update":

              description = os.environ.get(
                  "DESCRIPTION",
                  ""
              )

              weight = os.environ.get(
                  "WEIGHT",
                  ""
              )

              fpt_notes = os.environ.get(
                  "FPT_NOTES",
                  ""
              )

              current_price = os.environ.get(
                  "CURRENT_PRICE",
                  ""
              )

              photo_source_name = os.environ.get(
                  "PHOTO_SOURCE_NAME",
                  ""
              ).strip()


              # ==============================================
              # PRESERVE EXISTING PHOTO INFORMATION
              # ==============================================

              existing_photo = ""
              existing_photo_source_name = ""

              for item in items:

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) == item_id:

                      existing_photo = str(
                          item.get(
                              "photo",
                              ""
                          )
                      ).strip()

                      existing_photo_source_name = str(
                          item.get(
                              "photoSourceName",
                              ""
                          )
                      ).strip()

                      break


              # ==============================================
              # CHECK THE IMAGES FOLDER FIRST
              # ==============================================
              #
              # If the image already made it into GitHub but
              # items.json lost or has the wrong path, recover
              # the image locally instead of asking SharePoint
              # to send the same image again.
              #
              # Only reuse an existing image automatically when
              # this is a lightweight update with no incoming
              # photo filename, or when the incoming filename
              # matches the previously stored SharePoint photo.
              # ==============================================

              existing_image = find_existing_image(
                  images_folder,
                  item_id
              )

              source_matches_existing = (
                  not photo_source_name
                  or (
                      bool(existing_photo_source_name)
                      and photo_source_name == existing_photo_source_name
                  )
              )

              recovered_existing_image = False

              if (
                  existing_image is not None
                  and source_matches_existing
              ):

                  existing_photo = (
                      existing_image.as_posix()
                  )

                  recovered_existing_image = True

                  print(
                      "Existing GitHub image found:",
                      existing_photo
                  )

                  print(
                      "Using image from images folder."
                  )

              elif existing_image is not None:

                  print(
                      "An existing image was found, but the "
                      "SharePoint photo filename changed."
                  )

                  print(
                      "Old source:",
                      existing_photo_source_name
                  )

                  print(
                      "New source:",
                      photo_source_name
                  )

                  print(
                      "Waiting for the new photo chunks."
                  )


              # Lightweight updates do not always send
              # photoFileName. Preserve the last known
              # SharePoint photo identity in that case.

              if not photo_source_name:
                  photo_source_name = (
                      existing_photo_source_name
                  )


              # ==============================================
              # BUILD ITEM
              # ==============================================

              new_item = {
                  "id":
                      item_id,

                  "description":
                      description,

                  "weight":
                      weight,

                  "fptNotes":
                      fpt_notes,

                  "currentPrice":
                      current_price,

                  "photo":
                      existing_photo,

                  "photoSourceName":
                      photo_source_name
              }


              # ==============================================
              # UPDATE EXISTING ITEM OR ADD NEW ITEM
              # ==============================================

              found = False

              for index, item in enumerate(
                  items
              ):

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) == item_id:

                      items[index] = (
                          new_item
                      )

                      found = True
                      break


              if not found:

                  items.append(
                      new_item
                  )


              # ==============================================
              # SORT AND SAVE
              # ==============================================

              sort_items(
                  items
              )

              save_items(
                  data_file,
                  items
              )

              print(
                  "Item data updated."
              )

              print(
                  "Current price:",
                  current_price
              )


              # ==============================================
              # PHOTO EXPECTATION
              # ==============================================

              photo_chunk_count_text = os.environ.get(
                  "PHOTO_CHUNK_COUNT",
                  ""
              ).strip()

              try:

                  photo_chunk_count = int(
                      photo_chunk_count_text or "0"
                  )

              except ValueError:

                  photo_chunk_count = 0


              if photo_chunk_count > 0:

                  # If this is the SAME photo and the image
                  # already exists in images/, do not mark it
                  # missing again. Use the existing GitHub image.

                  if recovered_existing_image:

                      pending_file = (
                          chunk_root /
                          f"pending-{item_id}.txt"
                      )

                      if pending_file.exists():
                          pending_file.unlink()

                      print(
                          "Photo chunks were expected, but the "
                          "matching image already exists in GitHub."
                      )

                      print(
                          "Skipping another photo pull."
                      )

                      set_deploy_pages(
                          True
                      )

                  else:

                      pending_file = (
                          chunk_root /
                          f"pending-{item_id}.txt"
                      )

                      pending_file.write_text(
                          str(photo_chunk_count),
                          encoding="utf-8"
                      )

                      print(
                          "Photo pending:",
                          photo_chunk_count,
                          "chunks expected."
                      )

                      print(
                          "Pages deployment will wait for "
                          "the completed photo."
                      )

              else:

                  set_deploy_pages(
                      True
                  )


          # ==================================================
          # PHOTO CHUNK
          # ==================================================

          elif event_type == "metabid_photo_chunk":

              chunk_index_text = os.environ.get(
                  "CHUNK_INDEX",
                  ""
              ).strip()

              chunk_count_text = os.environ.get(
                  "CHUNK_COUNT",
                  ""
              ).strip()

              chunk_data = os.environ.get(
                  "CHUNK_DATA",
                  ""
              ).strip()

              photo_filename = os.environ.get(
                  "PHOTO_FILENAME",
                  ""
              ).strip()


              if chunk_index_text == "":

                  raise SystemExit(
                      "No chunkIndex received."
                  )


              if chunk_count_text == "":

                  raise SystemExit(
                      "No chunkCount received."
                  )


              if not chunk_data:

                  raise SystemExit(
                      "No chunkData received."
                  )


              chunk_index = int(
                  chunk_index_text
              )

              chunk_count = int(
                  chunk_count_text
              )


              print(
                  "Photo chunk:",
                  chunk_index + 1,
                  "of",
                  chunk_count
              )


              # ==============================================
              # CREATE ITEM CHUNK FOLDER
              # ==============================================

              item_chunk_folder = (
                  chunk_root /
                  item_id
              )

              item_chunk_folder.mkdir(
                  parents=True,
                  exist_ok=True
              )


              # ==============================================
              # SAVE PHOTO FILENAME
              # ==============================================

              if photo_filename:

                  (
                      item_chunk_folder /
                      "filename.txt"
                  ).write_text(
                      photo_filename,
                      encoding="utf-8"
                  )


              # ==============================================
              # SAVE CURRENT CHUNK
              # ==============================================

              chunk_file = (
                  item_chunk_folder /
                  f"{chunk_index:06d}.txt"
              )

              chunk_file.write_text(
                  chunk_data,
                  encoding="utf-8"
              )

              print(
                  "Saved chunk",
                  chunk_index + 1,
                  "of",
                  chunk_count
              )


              # ==============================================
              # CHECK FOR ALL CHUNKS
              # ==============================================

              expected_names = [
                  f"{index:06d}.txt"
                  for index in range(
                      chunk_count
                  )
              ]

              all_present = all(
                  (
                      item_chunk_folder /
                      name
                  ).exists()
                  for name in expected_names
              )


              # ==============================================
              # WAITING FOR MORE CHUNKS
              # ==============================================

              if not all_present:

                  actual_chunks = [
                      file
                      for file in
                      item_chunk_folder.glob(
                          "*.txt"
                      )
                      if file.name !=
                      "filename.txt"
                  ]

                  print(
                      "Waiting for remaining chunks.",
                      len(actual_chunks),
                      "of",
                      chunk_count,
                      "received."
                  )


              # ==============================================
              # ALL CHUNKS RECEIVED
              # ==============================================

              else:

                  print(
                      "All photo chunks received."
                  )


                  # ==========================================
                  # ASSEMBLE BASE64
                  # ==========================================

                  complete_base64 = ""

                  for index in range(
                      chunk_count
                  ):

                      current_chunk = (
                          item_chunk_folder /
                          f"{index:06d}.txt"
                      )

                      complete_base64 += (
                          current_chunk.read_text(
                              encoding="utf-8"
                          ).strip()
                      )


                  # ==========================================
                  # DETERMINE IMAGE EXTENSION
                  # ==========================================

                  filename_file = (
                      item_chunk_folder /
                      "filename.txt"
                  )

                  if filename_file.exists():

                      saved_filename = (
                          filename_file.read_text(
                              encoding="utf-8"
                          ).strip()
                      )

                  else:

                      saved_filename = (
                          photo_filename
                      )


                  extension = Path(
                      saved_filename
                  ).suffix.lower()

                  if extension not in [
                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".gif",
                      ".webp"
                  ]:

                      extension = ".jpg"


                  print(
                      "Image extension:",
                      extension
                  )


                  # ==========================================
                  # DECODE IMAGE
                  # ==========================================

                  try:

                      image_bytes = (
                          base64.b64decode(
                              complete_base64,
                              validate=False
                          )
                      )

                  except Exception as error:

                      raise SystemExit(
                          f"Could not decode image: {error}"
                      )


                  if not image_bytes:

                      raise SystemExit(
                          "Decoded image was empty."
                      )


                  print(
                      "Decoded photo bytes:",
                      len(image_bytes)
                  )


                  # ==========================================
                  # REMOVE OLD IMAGE
                  # ==========================================

                  for old_image in (
                      images_folder.glob(
                          f"{item_id}.*"
                      )
                  ):

                      old_image.unlink()


                  # ==========================================
                  # WRITE NEW IMAGE
                  # ==========================================

                  image_file = (
                      images_folder /
                      f"{item_id}{extension}"
                  )

                  image_file.write_bytes(
                      image_bytes
                  )

                  photo_path = (
                      f"images/"
                      f"{item_id}"
                      f"{extension}"
                  )


                  print(
                      "Photo saved:",
                      photo_path
                  )


                  # ==========================================
                  # RELOAD ITEMS.JSON
                  # ==========================================

                  items = load_items(
                      data_file
                  )


                  # ==========================================
                  # UPDATE PHOTO PATH
                  # ==========================================

                  found = False

                  for item in items:

                      if str(
                          item.get(
                              "id",
                              ""
                          )
                      ) == item_id:

                          item["photo"] = (
                              photo_path
                          )

                          item["photoSourceName"] = (
                              saved_filename
                          )

                          found = True
                          break


                  # ==========================================
                  # FALLBACK ITEM
                  # ==========================================

                  if not found:

                      items.append({
                          "id":
                              item_id,

                          "description":
                              "",

                          "weight":
                              "",

                          "fptNotes":
                              "",

                          "currentPrice":
                              "",

                          "photo":
                              photo_path,

                          "photoSourceName":
                              saved_filename
                      })


                  # ==========================================
                  # SORT AND SAVE ITEMS.JSON
                  # ==========================================

                  sort_items(
                      items
                  )

                  save_items(
                      data_file,
                      items
                  )


                  # ==========================================
                  # DELETE TEMP CHUNKS
                  # ==========================================

                  shutil.rmtree(
                      item_chunk_folder
                  )

                  pending_file = (
                      chunk_root /
                      f"pending-{item_id}.txt"
                  )

                  if pending_file.exists():
                      pending_file.unlink()


                  print(
                      "Photo assembly complete."
                  )


                  # The workflow will verify the committed copy
                  # on main before creating the acknowledgement.

                  set_step_output(
                      "photo_completed",
                      "true"
                  )

                  set_step_output(
                      "photo_filename",
                      saved_filename
                  )

                  set_deploy_pages(
                      True
                  )


          # ==================================================
          # REMOVE ITEM
          # ==================================================

          elif event_type == "metabid_remove":

              print(
                  "Removing item:",
                  item_id
              )

              items = [
                  item
                  for item in items
                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) != item_id
              ]

              save_items(
                  data_file,
                  items
              )


              # Remove image

              for old_image in (
                  images_folder.glob(
                      f"{item_id}.*"
                  )
              ):

                  old_image.unlink()


              # Remove unfinished chunks

              item_chunk_folder = (
                  chunk_root /
                  item_id
              )

              if item_chunk_folder.exists():

                  shutil.rmtree(
                      item_chunk_folder
                  )


              pending_file = (
                  chunk_root /
                  f"pending-{item_id}.txt"
              )

              if pending_file.exists():
                  pending_file.unlink()


              print(
                  "Removed MetaBid item:",
                  item_id
              )

              set_deploy_pages(
                  True
              )


          # ==================================================
          # UNKNOWN EVENT
          # ==================================================

          else:

              raise SystemExit(
                  f"Unknown event: {event_type}"
              )

          PY


      # ======================================================
      # COMMIT CHANGES
      # ======================================================

      - name: Commit MetaBid changes
        id: commit_changes
        env:
          ITEM_ID: ${{ github.event.client_payload.itemId }}
          EVENT_TYPE: ${{ github.event.action }}

        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git config user.name \
            "MetaBid Automation"

          git config user.email \
            "actions@github.com"

          git add -A


          # ==================================================
          # NOTHING CHANGED
          # ==================================================

          if git diff --cached --quiet
          then

            echo "No changes to commit."

            exit 0

          fi


          # ==================================================
          # CREATE COMMIT
          # ==================================================

          NON_CHUNK_CHANGES="$(
            git diff --cached --name-only |
            grep -v '^\.metabid_chunks/' || true
          )"

          if [ "$EVENT_TYPE" = "metabid_photo_chunk" ] && [ -z "$NON_CHUNK_CHANGES" ]
          then

            git commit \
              -m "MetaBid photo chunk item ${ITEM_ID}"

          elif [ "$EVENT_TYPE" = "metabid_photo_chunk" ]
          then

            git commit \
              -m "MetaBid complete photo item ${ITEM_ID}"

          else

            git commit \
              -m "MetaBid ${EVENT_TYPE} item ${ITEM_ID}"

          fi


          echo "Pushing MetaBid change..."


          # ==================================================
          # FIRST PUSH
          # ==================================================

          if git push origin HEAD:main
          then

            echo "Push successful."
            echo "pushed=true" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ==================================================
          # MAIN CHANGED
          # ==================================================

          echo ""
          echo "Main changed before this run could push."
          echo "Fetching newest main..."
          echo ""

          git fetch origin main


          # ==================================================
          # REBASE ONCE
          # ==================================================

          if GIT_EDITOR=true git rebase origin/main
          then

            echo ""
            echo "Rebase successful."
            echo ""


            # ================================================
            # SECOND PUSH
            # ================================================

            if git push origin HEAD:main
            then

              echo "Push successful after rebase."
              echo "pushed=true" >> "$GITHUB_OUTPUT"

              exit 0

            fi


            echo "Push failed after successful rebase."

            exit 1

          else

            echo ""
            echo "A merge conflict occurred."
            echo "Aborting rebase instead of retrying"
            echo "the same conflict repeatedly."
            echo ""

            git rebase --abort || true

            exit 1

          fi


      # ======================================================
      # VERIFY COMPLETED PHOTO ON MAIN
      #
      # Before creating the GitHub acknowledgement/issue,
      # check the actual images folder on main.
      #
      # If the image exists but items.json has the wrong
      # photo path, repair items.json from images/ instead of
      # asking SharePoint to send the same image again.
      # ======================================================

      - name: Verify completed photo and repair items.json
        id: verify_photo
        if: ${{ steps.process_event.outputs.photo_completed == 'true' && steps.commit_changes.outputs.pushed == 'true' }}

        env:
          ITEM_ID: ${{ github.event.client_payload.itemId }}
          PHOTO_FILENAME: ${{ steps.process_event.outputs.photo_filename }}

        run: |
          echo "image_found=false" >> "$GITHUB_OUTPUT"
          echo "photo_repaired=false" >> "$GITHUB_OUTPUT"
          echo "photo_path=" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Checking main branch for item ${ITEM_ID} image..."
          echo ""

          git fetch origin main
          git reset --hard origin/main


          python3 <<'PY'
          import json
          import os
          from pathlib import Path


          item_id = str(
              os.environ.get(
                  "ITEM_ID",
                  ""
              )
          ).strip()

          photo_filename = str(
              os.environ.get(
                  "PHOTO_FILENAME",
                  ""
              )
          ).strip()

          images_folder = Path(
              "images"
          )

          data_file = Path(
              "data/items.json"
          )

          allowed_extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".gif",
              ".webp"
          }


          # ==================================================
          # FIND IMAGE ALREADY STORED IN GITHUB
          # ==================================================

          matches = [
              path
              for path in images_folder.glob(
                  f"{item_id}.*"
              )
              if path.is_file()
              and path.suffix.lower() in allowed_extensions
          ]


          if not matches:

              print(
                  f"No image exists in images/ for item {item_id}."
              )

              raise SystemExit(0)


          matches.sort(
              key=lambda path: path.stat().st_mtime,
              reverse=True
          )

          image_file = matches[0]

          photo_path = (
              image_file.as_posix()
          )


          print(
              "Image found in GitHub:",
              photo_path
          )


          output_file = os.environ.get(
              "GITHUB_OUTPUT",
              ""
          )

          with open(
              output_file,
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  "image_found=true\n"
              )

              output.write(
                  f"photo_path={photo_path}\n"
              )


          # ==================================================
          # LOAD ITEMS.JSON
          # ==================================================

          if not data_file.exists():

              print(
                  "items.json does not exist."
              )

              raise SystemExit(1)


          try:

              items = json.loads(
                  data_file.read_text(
                      encoding="utf-8"
                  )
              )

          except Exception as error:

              raise SystemExit(
                  f"Could not read items.json: {error}"
              )


          if not isinstance(
              items,
              list
          ):

              raise SystemExit(
                  "items.json is not a list."
              )


          # ==================================================
          # REPAIR PHOTO REFERENCE
          # ==================================================

          found = False
          changed = False

          for item in items:

              if str(
                  item.get(
                      "id",
                      ""
                  )
              ) == item_id:

                  found = True

                  current_photo = str(
                      item.get(
                          "photo",
                          ""
                      )
                  ).strip()

                  if current_photo != photo_path:

                      print(
                          "Repairing photo path."
                      )

                      print(
                          "Old path:",
                          current_photo
                      )

                      print(
                          "New path:",
                          photo_path
                      )

                      item["photo"] = (
                          photo_path
                      )

                      changed = True


                  if (
                      photo_filename
                      and str(
                          item.get(
                              "photoSourceName",
                              ""
                          )
                      ).strip() != photo_filename
                  ):

                      print(
                          "Repairing photo source name."
                      )

                      item["photoSourceName"] = (
                          photo_filename
                      )

                      changed = True

                  break


          if not found:

              print(
                  f"Item {item_id} is missing from items.json."
              )

              print(
                  "Creating a fallback item so the existing "
                  "GitHub image can still be referenced."
              )

              items.append({
                  "id":
                      item_id,

                  "description":
                      "",

                  "weight":
                      "",

                  "fptNotes":
                      "",

                  "currentPrice":
                      "",

                  "photo":
                      photo_path,

                  "photoSourceName":
                      photo_filename
              })

              changed = True


          # ==================================================
          # SAVE ONLY IF A REPAIR IS NEEDED
          # ==================================================

          if changed:

              def sort_key(item):
                  value = str(
                      item.get(
                          "id",
                          ""
                      )
                  )

                  if value.isdigit():
                      return int(value)

                  return 999999999


              items.sort(
                  key=sort_key
              )


              data_file.write_text(
                  json.dumps(
                      items,
                      indent=2
                  ),
                  encoding="utf-8"
              )


              with open(
                  output_file,
                  "a",
                  encoding="utf-8"
              ) as output:

                  output.write(
                      "photo_repaired=true\n"
                  )


              print(
                  "items.json repaired from existing GitHub image."
              )

          else:

              print(
                  "items.json already points to the existing image."
              )

          PY


          # ==================================================
          # COMMIT REPAIR IF NEEDED
          # ==================================================

          if [ -n "$(git status --porcelain data/items.json)" ]
          then

            echo ""
            echo "Committing repaired photo reference..."
            echo ""

            git config user.name \
              "MetaBid Automation"

            git config user.email \
              "actions@github.com"

            git add data/items.json

            git commit \
              -m "Repair MetaBid photo reference item ${ITEM_ID}"


            if git push origin HEAD:main
            then

              echo ""
              echo "Photo reference repair pushed."
              echo ""

            else

              echo ""
              echo "Main changed while pushing repair."
              echo "Rebasing repair onto latest main..."
              echo ""

              git fetch origin main

              if GIT_EDITOR=true git rebase origin/main
              then

                git push origin HEAD:main

                echo ""
                echo "Photo reference repair pushed after rebase."
                echo ""

              else

                git rebase --abort || true

                echo ""
                echo "Could not safely push photo reference repair."
                echo ""

                exit 1

              fi

            fi

          else

            echo ""
            echo "No photo reference repair required."
            echo ""

          fi


      # ======================================================
      # ACKNOWLEDGE COMPLETED PHOTO TO POWER AUTOMATE
      #
      # This only happens AFTER GitHub confirms the image
      # exists in images/ and items.json points to it.
      # ======================================================

      - name: Create photo completion acknowledgement
        if: ${{ steps.process_event.outputs.photo_completed == 'true' && steps.verify_photo.outputs.image_found == 'true' }}

        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_ID: ${{ github.event.client_payload.itemId }}
          PHOTO_FILENAME: ${{ steps.process_event.outputs.photo_filename }}
          PHOTO_PATH: ${{ steps.verify_photo.outputs.photo_path }}

        run: |
          echo "Creating photo completion acknowledgement..."

          BODY=$(cat <<EOF
          METABID_PHOTO_COMPLETE
          ItemID: ${ITEM_ID}
          PhotoFileName: ${PHOTO_FILENAME}
          PhotoPath: ${PHOTO_PATH}
          EOF
          )

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "MetaBid Photo Complete - Item ${ITEM_ID}" \
            --body "$BODY" \
            --assignee "Fptmetabidven"

          echo "Photo completion acknowledgement created."


      # ======================================================
      # DEPLOY PAGES
      #
      # Normal item/remove changes deploy normally.
      # Completed photos deploy only after the image is
      # verified on main.
      # ======================================================

      - name: Deploy MetaBid Pages
        if: ${{ !cancelled() && steps.process_event.outputs.deploy_pages == 'true' && steps.commit_changes.outputs.pushed == 'true' && (steps.process_event.outputs.photo_completed != 'true' || steps.verify_photo.outputs.image_found == 'true') }}

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "Starting MetaBid Pages deployment..."

          gh workflow run \
            pages.yml \
            --ref main

          echo "Pages deployment requested."
