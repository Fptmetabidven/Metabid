name: MetaBid SharePoint Update

on:
  repository_dispatch:
    types:
      - metabid_update
      - metabid_photo_chunk

permissions:
  contents: write

concurrency:
  group: metabid-repo-write
  cancel-in-progress: false

jobs:
  update-metabid:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Process MetaBid event
        env:
          EVENT_TYPE: ${{ github.event.action }}

          ITEM_ID: ${{ github.event.client_payload.itemId }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          WEIGHT: ${{ github.event.client_payload.weight }}
          BID_PRICE: ${{ github.event.client_payload.bidPrice }}
          VENDOR_NAME: ${{ github.event.client_payload.vendorName }}

          PHOTO_FILENAME: ${{ github.event.client_payload.photoFileName }}
          PHOTO_CHUNK_COUNT: ${{ github.event.client_payload.photoChunkCount }}

          CHUNK_INDEX: ${{ github.event.client_payload.chunkIndex }}
          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}
          CHUNK_DATA: ${{ github.event.client_payload.chunkData }}

        run: |
          python3 <<'PY'

          import os
          import json
          import base64
          import shutil
          from pathlib import Path


          event_type = os.environ.get(
              "EVENT_TYPE",
              ""
          ).strip()


          item_id = os.environ.get(
              "ITEM_ID",
              ""
          ).strip()


          if not item_id:
              raise SystemExit(
                  "No itemId received."
              )


          print(
              "Event:",
              event_type
          )

          print(
              "Item:",
              item_id
          )


          # ------------------------------------------------
          # Folders
          # ------------------------------------------------

          data_folder = Path(
              "data"
          )

          images_folder = Path(
              "images"
          )

          chunk_root = Path(
              ".metabid_chunks"
          )


          data_folder.mkdir(
              exist_ok=True
          )

          images_folder.mkdir(
              exist_ok=True
          )

          chunk_root.mkdir(
              exist_ok=True
          )


          data_file = data_folder / "items.json"


          # ------------------------------------------------
          # Load current inventory
          # ------------------------------------------------

          if data_file.exists():

              try:

                  items = json.loads(
                      data_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  items = []

          else:

              items = []


          if not isinstance(
              items,
              list
          ):

              items = []


          # =================================================
          # NORMAL ITEM UPDATE
          # =================================================

          if event_type == "metabid_update":

              description = os.environ.get(
                  "DESCRIPTION",
                  ""
              )

              weight = os.environ.get(
                  "WEIGHT",
                  ""
              )

              bid_price = os.environ.get(
                  "BID_PRICE",
                  ""
              )

              vendor_name = os.environ.get(
                  "VENDOR_NAME",
                  ""
              )

              photo_filename = os.environ.get(
                  "PHOTO_FILENAME",
                  ""
              ).strip()

              photo_chunk_count = os.environ.get(
                  "PHOTO_CHUNK_COUNT",
                  ""
              ).strip()


              existing_photo = ""


              for item in items:

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) == item_id:

                      existing_photo = item.get(
                          "photo",
                          ""
                      )

                      break


              new_item = {

                  "id": item_id,

                  "description": description,

                  "weight": weight,

                  "bidPrice": bid_price,

                  "vendorName": vendor_name,

                  "photo": existing_photo

              }


              found = False


              for index, item in enumerate(
                  items
              ):

                  if str(
                      item.get(
                          "id",
                          ""
                      )
                  ) == item_id:

                      items[index] = new_item

                      found = True

                      break


              if not found:

                  items.append(
                      new_item
                  )


              def sort_key(
                  item
              ):

                  value = str(
                      item.get(
                          "id",
                          ""
                      )
                  )

                  if value.isdigit():

                      return int(
                          value
                      )

                  return 999999999


              items.sort(
                  key=sort_key
              )


              data_file.write_text(

                  json.dumps(
                      items,
                      indent=2
                  ),

                  encoding="utf-8"

              )


              print(
                  "Item data updated."
              )

              print(
                  "Description:",
                  description
              )

              print(
                  "Photo filename:",
                  photo_filename
              )

              print(
                  "Expected photo chunks:",
                  photo_chunk_count
              )


          # =================================================
          # PHOTO CHUNK
          # =================================================

          elif event_type == "metabid_photo_chunk":

              chunk_index_text = os.environ.get(
                  "CHUNK_INDEX",
                  ""
              ).strip()

              chunk_count_text = os.environ.get(
                  "CHUNK_COUNT",
                  ""
              ).strip()

              chunk_data = os.environ.get(
                  "CHUNK_DATA",
                  ""
              ).strip()

              photo_filename = os.environ.get(
                  "PHOTO_FILENAME",
                  ""
              ).strip()


              if chunk_index_text == "":

                  raise SystemExit(
                      "No chunkIndex received."
                  )


              if chunk_count_text == "":

                  raise SystemExit(
                      "No chunkCount received."
                  )


              if not chunk_data:

                  raise SystemExit(
                      "No chunkData received."
                  )


              chunk_index = int(
                  chunk_index_text
              )

              chunk_count = int(
                  chunk_count_text
              )


              item_chunk_folder = (
                  chunk_root / item_id
              )


              item_chunk_folder.mkdir(
                  parents=True,
                  exist_ok=True
              )


              # --------------------------------------------
              # Save filename
              # --------------------------------------------

              if photo_filename:

                  (
                      item_chunk_folder /
                      "filename.txt"
                  ).write_text(

                      photo_filename,

                      encoding="utf-8"

                  )


              # --------------------------------------------
              # Save this chunk
              # --------------------------------------------

              chunk_file = (
                  item_chunk_folder /
                  f"{chunk_index:06d}.txt"
              )


              chunk_file.write_text(

                  chunk_data,

                  encoding="utf-8"

              )


              print(
                  "Saved chunk",
                  chunk_index + 1,
                  "of",
                  chunk_count
              )


              # --------------------------------------------
              # Count received chunks
              # --------------------------------------------

              chunk_files = sorted(
                  item_chunk_folder.glob(
                      "*.txt"
                  )
              )


              actual_chunk_files = [

                  file

                  for file in chunk_files

                  if file.name != "filename.txt"

              ]


              print(
                  "Chunks currently stored:",
                  len(actual_chunk_files)
              )


              # --------------------------------------------
              # Assemble only when ALL chunks exist
              # --------------------------------------------

              expected_names = [

                  f"{index:06d}.txt"

                  for index in range(
                      chunk_count
                  )

              ]


              all_present = all(

                  (
                      item_chunk_folder /
                      name
                  ).exists()

                  for name in expected_names

              )


              if not all_present:

                  print(
                      "Waiting for remaining chunks."
                  )

              else:

                  print(
                      "All chunks received."
                  )


                  complete_base64 = ""


                  for index in range(
                      chunk_count
                  ):

                      complete_base64 += (

                          item_chunk_folder /
                          f"{index:06d}.txt"

                      ).read_text(
                          encoding="utf-8"
                      ).strip()


                  # ----------------------------------------
                  # Determine filename / extension
                  # ----------------------------------------

                  filename_file = (
                      item_chunk_folder /
                      "filename.txt"
                  )


                  if filename_file.exists():

                      saved_filename = (
                          filename_file.read_text(
                              encoding="utf-8"
                          ).strip()
                      )

                  else:

                      saved_filename = (
                          photo_filename
                      )


                  extension = Path(
                      saved_filename
                  ).suffix.lower()


                  if extension not in [

                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".gif",
                      ".webp"

                  ]:

                      extension = ".jpg"


                  # ----------------------------------------
                  # Remove previous image for this item
                  # ----------------------------------------

                  for old_image in images_folder.glob(
                      f"{item_id}.*"
                  ):

                      old_image.unlink()


                  # ----------------------------------------
                  # Decode assembled image
                  # ----------------------------------------

                  image_file = (

                      images_folder /
                      f"{item_id}{extension}"

                  )


                  try:

                      image_bytes = base64.b64decode(
                          complete_base64,
                          validate=False
                      )

                  except Exception as error:

                      raise SystemExit(
                          f"Could not decode image: {error}"
                      )


                  image_file.write_bytes(
                      image_bytes
                  )


                  photo_path = (
                      f"images/{item_id}{extension}"
                  )


                  print(
                      "Photo saved:",
                      photo_path
                  )


                  # ----------------------------------------
                  # Reload inventory in case item was added
                  # by an earlier event
                  # ----------------------------------------

                  if data_file.exists():

                      try:

                          items = json.loads(
                              data_file.read_text(
                                  encoding="utf-8"
                              )
                          )

                      except Exception:

                          items = []


                  if not isinstance(
                      items,
                      list
                  ):

                      items = []


                  found = False


                  for item in items:

                      if str(
                          item.get(
                              "id",
                              ""
                          )
                      ) == item_id:

                          item["photo"] = photo_path

                          found = True

                          break


                  # If photo arrived before the item event,
                  # create a temporary item.
                  if not found:

                      items.append({

                          "id": item_id,

                          "description": "",

                          "weight": "",

                          "bidPrice": "",

                          "vendorName": "",

                          "photo": photo_path

                      })


                  def sort_key(
                      item
                  ):

                      value = str(
                          item.get(
                              "id",
                              ""
                          )
                      )

                      if value.isdigit():

                          return int(
                              value
                          )

                      return 999999999


                  items.sort(
                      key=sort_key
                  )


                  data_file.write_text(

                      json.dumps(
                          items,
                          indent=2
                      ),

                      encoding="utf-8"

                  )


                  # ----------------------------------------
                  # Delete temporary chunk files
                  # ----------------------------------------

                  shutil.rmtree(
                      item_chunk_folder
                  )


                  print(
                      "Photo assembly complete."
                  )


          else:

              raise SystemExit(
                  f"Unknown repository dispatch event: {event_type}"
              )


          PY


      - name: Commit MetaBid changes
        run: |

          git config user.name "MetaBid Automation"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet
          then

            echo "No changes to commit."

          else

            git commit \
              -m "Update MetaBid item ${{ github.event.client_payload.itemId }}"

            git pull --rebase origin main

            git push origin HEAD:main

          fi
