name: MetaBid SharePoint Update

on:
  repository_dispatch:
    types:
      - metabid_update
      - metabid_photo_chunk
      - metabid_photo_finalize
      - metabid_remove

permissions:
  contents: write


jobs:

  # ==========================================================
  # ITEM UPDATE
  # ==========================================================

  update-item:

    if: github.event.action == 'metabid_update'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Update item data
        env:
          ITEM_ID: ${{ github.event.client_payload.itemId }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          WEIGHT: ${{ github.event.client_payload.weight }}
          BID_PRICE: ${{ github.event.client_payload.bidPrice }}
          VENDOR_NAME: ${{ github.event.client_payload.vendorName }}
          VENDOR_EMAIL: ${{ github.event.client_payload.vendorEmail }}
          VENDOR_NOTES: ${{ github.event.client_payload.vendorNotes }}

        run: |

          python3 <<'PY'

          import os
          import json
          from pathlib import Path


          item_id = os.environ.get(
              "ITEM_ID",
              ""
          ).strip()


          if not item_id:
              raise SystemExit(
                  "No itemId received."
              )


          data_folder = Path("data")
          data_folder.mkdir(exist_ok=True)

          data_file = data_folder / "items.json"


          if data_file.exists():

              try:

                  items = json.loads(
                      data_file.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  items = []

          else:

              items = []


          if not isinstance(items, list):
              items = []


          existing_photo = ""


          for item in items:

              if str(
                  item.get("id", "")
              ) == item_id:

                  existing_photo = item.get(
                      "photo",
                      ""
                  )

                  break


          new_item = {

              "id":
                  item_id,

              "description":
                  os.environ.get(
                      "DESCRIPTION",
                      ""
                  ),

              "weight":
                  os.environ.get(
                      "WEIGHT",
                      ""
                  ),

              "bidPrice":
                  os.environ.get(
                      "BID_PRICE",
                      ""
                  ),

              "vendorName":
                  os.environ.get(
                      "VENDOR_NAME",
                      ""
                  ),

              "vendorEmail":
                  os.environ.get(
                      "VENDOR_EMAIL",
                      ""
                  ),

              "vendorNotes":
                  os.environ.get(
                      "VENDOR_NOTES",
                      ""
                  ),

              "photo":
                  existing_photo

          }


          found = False


          for index, item in enumerate(items):

              if str(
                  item.get("id", "")
              ) == item_id:

                  items[index] = new_item

                  found = True

                  break


          if not found:
              items.append(new_item)


          def sort_key(item):

              value = str(
                  item.get("id", "")
              )

              if value.isdigit():
                  return int(value)

              return 999999999


          items.sort(key=sort_key)


          data_file.write_text(

              json.dumps(
                  items,
                  indent=2
              ),

              encoding="utf-8"

          )


          print(
              "Updated MetaBid item:",
              item_id
          )

          PY


      - name: Commit item update
        env:
          ITEM_ID: ${{ github.event.client_payload.itemId }}

        run: |

          git config user.name "MetaBid Automation"
          git config user.email "actions@github.com"

          git add data/items.json


          if git diff --cached --quiet
          then

            echo "No item changes."

            exit 0

          fi


          git commit \
            -m "Update MetaBid item ${ITEM_ID}"


          for attempt in 1 2 3 4 5 6
          do

            echo "Push attempt ${attempt}"


            if git pull --rebase origin main
            then

              if git push origin HEAD:main
              then

                echo "Item update pushed."

                exit 0

              fi

            else

              git rebase --abort || true

            fi


            sleep $((attempt * 2))

          done


          echo "Unable to push item update."

          exit 1



  # ==========================================================
  # PHOTO CHUNK
  #
  # IMPORTANT:
  # Each chunk gets its own temporary branch.
  #
  # These DO NOT change main.
  # Therefore they DO NOT redeploy the website.
  # ==========================================================

  save-photo-chunk:

    if: github.event.action == 'metabid_photo_chunk'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Save chunk to temporary branch
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          CHUNK_INDEX: ${{ github.event.client_payload.chunkIndex }}

          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}

          CHUNK_DATA: ${{ github.event.client_payload.chunkData }}

        run: |

          if [ -z "${ITEM_ID}" ]
          then
            echo "Missing itemId."
            exit 1
          fi


          if [ -z "${CHUNK_INDEX}" ]
          then
            echo "Missing chunkIndex."
            exit 1
          fi


          if [ -z "${CHUNK_DATA}" ]
          then
            echo "Missing chunkData."
            exit 1
          fi


          PADDED_INDEX=$(printf "%06d" "${CHUNK_INDEX}")


          BRANCH_NAME="metabid-chunk-${ITEM_ID}-${PADDED_INDEX}"


          echo "Creating temporary branch:"
          echo "${BRANCH_NAME}"


          git config user.name "MetaBid Automation"
          git config user.email "actions@github.com"


          git checkout \
            -b \
            "${BRANCH_NAME}"


          printf '%s' "${CHUNK_DATA}" \
            > .metabid_chunk.txt


          printf '%s' "${CHUNK_COUNT}" \
            > .metabid_chunk_count.txt


          git add \
            .metabid_chunk.txt \
            .metabid_chunk_count.txt


          git commit \
            -m "Temporary MetaBid photo chunk ${ITEM_ID}-${PADDED_INDEX}"


          git push \
            --force \
            origin \
            "${BRANCH_NAME}"


          echo "Temporary chunk branch uploaded successfully."



  # ==========================================================
  # PHOTO FINALIZE
  #
  # Runs ONCE after Power Automate finishes its Apply to each.
  #
  # Waits for all temporary chunk branches.
  # Downloads each chunk.
  # Builds the image.
  # Updates items.json.
  # Commits ONCE to main.
  # Deletes temporary branches.
  # ==========================================================

  finalize-photo:

    if: github.event.action == 'metabid_photo_finalize'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Wait for photo chunks
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}

        run: |

          if [ -z "${ITEM_ID}" ]
          then

            echo "Missing itemId."

            exit 1

          fi


          if [ -z "${CHUNK_COUNT}" ]
          then

            echo "Missing chunkCount."

            exit 1

          fi


          echo "Waiting for ${CHUNK_COUNT} photo chunks."


          for attempt in $(seq 1 60)
          do

            FOUND=0


            for index in $(seq 0 $((CHUNK_COUNT - 1)))
            do

              PADDED_INDEX=$(printf "%06d" "${index}")


              BRANCH_NAME="metabid-chunk-${ITEM_ID}-${PADDED_INDEX}"


              if git ls-remote \
                --exit-code \
                --heads \
                origin \
                "${BRANCH_NAME}" \
                > /dev/null 2>&1
              then

                FOUND=$((FOUND + 1))

              fi

            done


            echo \
              "Found ${FOUND} of ${CHUNK_COUNT} chunks."


            if [ "${FOUND}" -eq "${CHUNK_COUNT}" ]
            then

              echo "All chunks are ready."

              exit 0

            fi


            sleep 2

          done


          echo "Timed out waiting for photo chunks."

          exit 1


      - name: Download photo chunks
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}

        run: |

          mkdir -p \
            ".metabid_download/${ITEM_ID}"


          for index in $(seq 0 $((CHUNK_COUNT - 1)))
          do

            PADDED_INDEX=$(printf "%06d" "${index}")


            BRANCH_NAME="metabid-chunk-${ITEM_ID}-${PADDED_INDEX}"


            echo \
              "Downloading chunk ${PADDED_INDEX}"


            git fetch \
              origin \
              "${BRANCH_NAME}"


            git show \
              FETCH_HEAD:.metabid_chunk.txt \
              > ".metabid_download/${ITEM_ID}/${PADDED_INDEX}.txt"

          done


          echo "All chunks downloaded."


      - name: Assemble photo
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}

          PHOTO_FILENAME: ${{ github.event.client_payload.photoFileName }}

        run: |

          python3 <<'PY'

          import os
          import json
          import base64
          from pathlib import Path


          item_id = os.environ.get(
              "ITEM_ID",
              ""
          ).strip()


          chunk_count = int(
              os.environ.get(
                  "CHUNK_COUNT",
                  "0"
              )
          )


          photo_filename = os.environ.get(
              "PHOTO_FILENAME",
              ""
          ).strip()


          if not item_id:
              raise SystemExit(
                  "Missing itemId."
              )


          if chunk_count <= 0:
              raise SystemExit(
                  "Invalid chunkCount."
              )


          chunk_folder = (

              Path(".metabid_download")
              /
              item_id

          )


          complete_base64 = ""


          for index in range(chunk_count):

              chunk_file = (

                  chunk_folder
                  /
                  f"{index:06d}.txt"

              )


              if not chunk_file.exists():

                  raise SystemExit(
                      f"Missing chunk {index}"
                  )


              complete_base64 += (

                  chunk_file.read_text(
                      encoding="utf-8"
                  ).strip()

              )


          extension = Path(
              photo_filename
          ).suffix.lower()


          if extension not in [

              ".jpg",
              ".jpeg",
              ".png",
              ".gif",
              ".webp"

          ]:

              extension = ".jpg"


          images_folder = Path("images")

          images_folder.mkdir(
              exist_ok=True
          )


          for old_image in images_folder.glob(
              f"{item_id}.*"
          ):

              old_image.unlink()


          image_file = (

              images_folder
              /
              f"{item_id}{extension}"

          )


          try:

              image_bytes = base64.b64decode(

                  complete_base64,

                  validate=False

              )

          except Exception as error:

              raise SystemExit(
                  f"Image decode failed: {error}"
              )


          image_file.write_bytes(
              image_bytes
          )


          print(
              "Image size:",
              len(image_bytes),
              "bytes"
          )


          photo_path = (
              f"images/{item_id}{extension}"
          )


          data_folder = Path("data")

          data_folder.mkdir(
              exist_ok=True
          )


          data_file = (

              data_folder /
              "items.json"

          )


          if data_file.exists():

              try:

                  items = json.loads(

                      data_file.read_text(
                          encoding="utf-8"
                      )

                  )

              except Exception:

                  items = []

          else:

              items = []


          if not isinstance(items, list):
              items = []


          found = False


          for item in items:

              if str(
                  item.get("id", "")
              ) == item_id:

                  item["photo"] = photo_path

                  found = True

                  break


          if not found:

              items.append({

                  "id":
                      item_id,

                  "description":
                      "",

                  "weight":
                      "",

                  "bidPrice":
                      "",

                  "vendorName":
                      "",

                  "vendorEmail":
                      "",

                  "vendorNotes":
                      "",

                  "photo":
                      photo_path

              })


          def sort_key(item):

              value = str(
                  item.get(
                      "id",
                      ""
                  )
              )

              if value.isdigit():
                  return int(value)

              return 999999999


          items.sort(
              key=sort_key
          )


          data_file.write_text(

              json.dumps(
                  items,
                  indent=2
              ),

              encoding="utf-8"

          )


          print(
              "Photo assembled:",
              photo_path
          )


          PY


      - name: Commit completed photo
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

        run: |

          rm -rf .metabid_download


          git config user.name "MetaBid Automation"

          git config user.email "actions@github.com"


          git add \
            images \
            data/items.json


          if git diff --cached --quiet
          then

            echo "No photo changes."

          else

            git commit \
              -m "Complete MetaBid photo ${ITEM_ID}"


            for attempt in 1 2 3 4 5 6
            do

              echo "Push attempt ${attempt}"


              if git pull --rebase origin main
              then

                if git push origin HEAD:main
                then

                  echo "Completed photo pushed."

                  break

                fi

              else

                git rebase --abort || true

              fi


              if [ "${attempt}" -eq 6 ]
              then

                echo "Unable to push completed photo."

                exit 1

              fi


              sleep $((attempt * 2))

            done

          fi


      - name: Delete temporary photo branches
        if: success()

        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

          CHUNK_COUNT: ${{ github.event.client_payload.chunkCount }}

        run: |

          echo "Cleaning temporary chunk branches."


          for index in $(seq 0 $((CHUNK_COUNT - 1)))
          do

            PADDED_INDEX=$(printf "%06d" "${index}")


            BRANCH_NAME="metabid-chunk-${ITEM_ID}-${PADDED_INDEX}"


            git push \
              origin \
              --delete \
              "${BRANCH_NAME}" \
              || true

          done


          echo "Temporary branches removed."



  # ==========================================================
  # REMOVE CLOSED ITEM
  # ==========================================================

  remove-item:

    if: github.event.action == 'metabid_remove'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Remove item
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

        run: |

          python3 <<'PY'

          import os
          import json
          from pathlib import Path


          item_id = os.environ.get(
              "ITEM_ID",
              ""
          ).strip()


          if not item_id:

              raise SystemExit(
                  "Missing itemId."
              )


          data_file = Path(
              "data/items.json"
          )


          if data_file.exists():

              try:

                  items = json.loads(

                      data_file.read_text(
                          encoding="utf-8"
                      )

                  )

              except Exception:

                  items = []

          else:

              items = []


          if not isinstance(items, list):
              items = []


          items = [

              item

              for item in items

              if str(
                  item.get(
                      "id",
                      ""
                  )
              ) != item_id

          ]


          data_file.parent.mkdir(
              exist_ok=True
          )


          data_file.write_text(

              json.dumps(
                  items,
                  indent=2
              ),

              encoding="utf-8"

          )


          images_folder = Path("images")


          if images_folder.exists():

              for image in images_folder.glob(
                  f"{item_id}.*"
              ):

                  image.unlink()


          print(
              "Removed item:",
              item_id
          )

          PY


      - name: Commit removal
        env:

          ITEM_ID: ${{ github.event.client_payload.itemId }}

        run: |

          git config user.name "MetaBid Automation"

          git config user.email "actions@github.com"


          git add -A


          if git diff --cached --quiet
          then

            echo "Nothing to remove."

            exit 0

          fi


          git commit \
            -m "Remove MetaBid item ${ITEM_ID}"


          for attempt in 1 2 3 4 5 6
          do

            if git pull --rebase origin main
            then

              if git push origin HEAD:main
              then

                echo "Removal pushed."

                exit 0

              fi

            else

              git rebase --abort || true

            fi


            sleep $((attempt * 2))

          done


          exit 1
