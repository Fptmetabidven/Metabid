name: Auto Retry Failed Pages Deployment

on:
  workflow_run:
    workflows:
      - "pages-build-deployment"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-pages:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest

    steps:
      - name: Wait before retry
        run: sleep 30

      - name: Re-run failed Pages jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          echo "Pages deployment failed."
          echo "Run ID: $RUN_ID"
          echo "Current attempt: ${{ github.event.workflow_run.run_attempt }}"
          echo "Retrying failed jobs..."

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"

          echo "Retry request sent."
