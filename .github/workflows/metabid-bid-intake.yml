name: MetaBid Bid Intake

on:
  repository_dispatch:
    types:
      - metabid_bid_batch

permissions:
  contents: read
  issues: write

jobs:
  receive-bid:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm MetaBid bid submission
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submissionId }}
          SUBMITTED_AT: ${{ github.event.client_payload.submittedAt }}
          COMPANY_NAME: ${{ github.event.client_payload.companyName }}
          VENDOR_EMAIL: ${{ github.event.client_payload.vendorEmail }}
          GENERAL_NOTES: ${{ github.event.client_payload.generalNotes }}
          BIDS_JSON: ${{ toJson(github.event.client_payload.bids) }}
        run: |
          echo "======================================"
          echo "MetaBid bid submission received"
          echo "======================================"
          echo "Submission ID: $SUBMISSION_ID"
          echo "Submitted At:  $SUBMITTED_AT"
          echo "Company:       $COMPANY_NAME"
          echo "Vendor Email:  $VENDOR_EMAIL"
          echo ""
          echo "Bid payload received:"
          echo "$BIDS_JSON"
          echo "======================================"

      - name: Validate required fields
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submissionId }}
          COMPANY_NAME: ${{ github.event.client_payload.companyName }}
          VENDOR_EMAIL: ${{ github.event.client_payload.vendorEmail }}
          BIDS_JSON: ${{ toJson(github.event.client_payload.bids) }}
        run: |
          if [ -z "$SUBMISSION_ID" ]; then
            echo "ERROR: Missing submission ID."
            exit 1
          fi

          if [ -z "$COMPANY_NAME" ]; then
            echo "ERROR: Missing company name."
            exit 1
          fi

          if [ -z "$VENDOR_EMAIL" ]; then
            echo "ERROR: Missing vendor email."
            exit 1
          fi

          if [ "$BIDS_JSON" = "null" ] || [ "$BIDS_JSON" = "[]" ]; then
            echo "ERROR: No bids received."
            exit 1
          fi

          echo "MetaBid submission passed validation."

      - name: Create Power Automate bid issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_ID: ${{ github.event.client_payload.submissionId }}
          SUBMITTED_AT: ${{ github.event.client_payload.submittedAt }}
          COMPANY_NAME: ${{ github.event.client_payload.companyName }}
          VENDOR_EMAIL: ${{ github.event.client_payload.vendorEmail }}
          GENERAL_NOTES: ${{ github.event.client_payload.generalNotes }}
          BIDS_JSON: ${{ toJson(github.event.client_payload.bids) }}
        run: |
          cat > /tmp/metabid-issue.txt <<EOF
          METABID_BID_SUBMISSION

          SubmissionID: $SUBMISSION_ID
          SubmittedAt: $SUBMITTED_AT
          CompanyName: $COMPANY_NAME
          VendorEmail: $VENDOR_EMAIL

          GENERAL_NOTES_START
          $GENERAL_NOTES
          GENERAL_NOTES_END

          BIDS_JSON_START
          $BIDS_JSON
          BIDS_JSON_END
          EOF

          echo "Creating GitHub issue for Power Automate..."

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "MetaBid Bid - $SUBMISSION_ID" \
            --body-file /tmp/metabid-issue.txt \
            --assignee "${{ github.repository_owner }}"

          echo "GitHub issue created successfully."
