name: Deploy MetaBid Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "admin.html"
      - "data/**"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload MetaBid site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy MetaBid site
        id: deployment
        uses: actions/deploy-pages@v4
