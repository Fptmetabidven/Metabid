- name: Remove deleted SharePoint items
  env:
    CURRENT_IDS: ${{ github.event.client_payload.currentIds }}

  run: |
    python3 <<'PY'

    import json
    import os
    from pathlib import Path

    # ==========================================
    # READ CURRENT IDS FROM POWER AUTOMATE
    # ==========================================

    raw_ids = os.environ.get(
        "CURRENT_IDS",
        ""
    ).strip()

    print(
        "Raw CURRENT_IDS:",
        repr(raw_ids)
    )


    # ==========================================
    # SAFETY CHECK
    # Blank means something went wrong.
    # DELETE NOTHING.
    # ==========================================

    if not raw_ids:

        print(
            "ERROR: currentIds was not received "
            "from Power Automate."
        )

        print(
            "Cleanup stopped for safety."
        )

        raise SystemExit(1)


    # ==========================================
    # BUILD CURRENT SHAREPOINT ID LIST
    # NONE means SharePoint successfully
    # returned zero items.
    # ==========================================

    if raw_ids.upper() == "NONE":

        print(
            "SharePoint list is confirmed empty."
        )

        print(
            "All MetaBid website items will be removed."
        )

        current_ids = set()

    else:

        current_ids = {
            value.strip()
            for value in raw_ids.split(",")
            if value.strip()
        }


    print(
        "Current SharePoint IDs:",
        sorted(current_ids)
    )


    # ==========================================
    # PATHS
    # ==========================================

    data_file = Path(
        "data/items.json"
    )

    images_dir = Path(
        "images"
    )

    chunks_dir = Path(
        ".metabid_chunks"
    )


    # ==========================================
    # LOAD CURRENT GITHUB INVENTORY
    # ==========================================

    if not data_file.exists():

        print(
            "data/items.json does not exist."
        )

        print(
            "Nothing to clean."
        )

        raise SystemExit(0)


    try:

        with data_file.open(
            "r",
            encoding="utf-8"
        ) as file:

            items = json.load(file)

    except Exception as exc:

        print(
            "ERROR: Could not read data/items.json"
        )

        print(exc)

        raise SystemExit(1)


    # ==========================================
    # SUPPORT BOTH:
    #
    # [
    #   {...},
    #   {...}
    # ]
    #
    # AND:
    #
    # {
    #   "items": [...]
    # }
    # ==========================================

    wrapped_inventory = False

    if isinstance(items, dict):

        if isinstance(
            items.get("items"),
            list
        ):

            inventory = items["items"]

            wrapped_inventory = True

        else:

            print(
                "ERROR: Unknown items.json structure."
            )

            raise SystemExit(1)

    elif isinstance(items, list):

        inventory = items

    else:

        print(
            "ERROR: items.json is not a list "
            "or supported object."
        )

        raise SystemExit(1)


    print(
        "Items currently on website:",
        len(inventory)
    )


    # ==========================================
    # FIND ITEMS THAT NO LONGER EXIST
    # IN SHAREPOINT
    # ==========================================

    removed_ids = []

    remaining_items = []


    for item in inventory:

        item_id = str(
            item.get(
                "id",
                item.get(
                    "itemId",
                    ""
                )
            )
        ).strip()


        if not item_id:

            # Don't delete malformed records
            # automatically.

            print(
                "WARNING: Item without ID preserved:",
                item
            )

            remaining_items.append(
                item
            )

            continue


        if item_id in current_ids:

            print(
                "KEEP:",
                item_id
            )

            remaining_items.append(
                item
            )

        else:

            print(
                "REMOVE:",
                item_id
            )

            removed_ids.append(
                item_id
            )


    # ==========================================
    # DELETE PHOTOS FOR REMOVED ITEMS
    # ==========================================

    if images_dir.exists():

        for item_id in removed_ids:

            for image_file in images_dir.glob(
                f"{item_id}.*"
            ):

                if image_file.is_file():

                    print(
                        "Deleting image:",
                        image_file
                    )

                    image_file.unlink()


    # ==========================================
    # DELETE UNFINISHED PHOTO CHUNKS
    # FOR REMOVED ITEMS
    # ==========================================

    if chunks_dir.exists():

        import shutil

        for item_id in removed_ids:

            item_chunk_dir = (
                chunks_dir /
                item_id
            )

            if item_chunk_dir.exists():

                print(
                    "Deleting unfinished chunks:",
                    item_chunk_dir
                )

                shutil.rmtree(
                    item_chunk_dir
                )


    # ==========================================
    # SAVE UPDATED INVENTORY
    # ==========================================

    if wrapped_inventory:

        items["items"] = (
            remaining_items
        )

        output_data = items

    else:

        output_data = (
            remaining_items
        )


    data_file.parent.mkdir(
        parents=True,
        exist_ok=True
    )


    with data_file.open(
        "w",
        encoding="utf-8"
    ) as file:

        json.dump(
            output_data,
            file,
            indent=2,
            ensure_ascii=False
        )

        file.write("\n")


    # ==========================================
    # RESULTS
    # ==========================================

    print()
    print(
        "MetaBid cleanup complete."
    )

    print(
        "Removed IDs:",
        removed_ids
    )

    print(
        "Remaining items:",
        len(remaining_items)
    )


    if not current_ids:

        print(
            "SharePoint contains zero items."
        )

        print(
            "MetaBid public inventory is now empty."
        )

    PY
