name: MetaBid SharePoint Sync

on:
  repository_dispatch:
    types: [metabid_sync]

permissions:
  contents: write

jobs:
  sync-metabid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove deleted SharePoint items
        env:
          CURRENT_IDS: ${{ toJson(github.event.client_payload.currentIds) }}

        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          # ------------------------------------------
          # Read IDs currently existing in SharePoint
          # ------------------------------------------

          raw_ids = os.environ.get("CURRENT_IDS", "").strip()

          print("Raw CURRENT_IDS:", raw_ids)

          if not raw_ids or raw_ids in ("null", '""'):
              print("ERROR: No currentIds received from Power Automate.")
              print("Cleanup stopped for safety.")
              raise SystemExit(1)

          try:
              parsed = json.loads(raw_ids)
          except json.JSONDecodeError:
              parsed = raw_ids

          # Support:
          # ["1","2","3"]
          # [1,2,3]
          # "1,2,3"
          # "1, 2, 3"

          if isinstance(parsed, list):
              current_ids = {
                  str(value).strip()
                  for value in parsed
                  if str(value).strip()
              }

          elif isinstance(parsed, str):
              current_ids = {
                  value.strip()
                  for value in parsed.split(",")
                  if value.strip()
              }

          else:
              current_ids = {str(parsed).strip()}

          print(
              "Current SharePoint IDs:",
              sorted(current_ids)
          )

          if not current_ids:
              print("ERROR: Parsed SharePoint ID list is empty.")
              print("Cleanup stopped for safety.")
              raise SystemExit(1)

          # ------------------------------------------
          # Load MetaBid inventory
          # ------------------------------------------

          data_file = Path("data/items.json")

          if not data_file.exists():
              print("ERROR: data/items.json does not exist.")
              raise SystemExit(1)

          try:
              items = json.loads(
                  data_file.read_text(encoding="utf-8")
              )
          except Exception as error:
              print("Could not read items.json:", error)
              raise SystemExit(1)

          if not isinstance(items, list):
              print("ERROR: items.json is not a list.")
              raise SystemExit(1)

          print("Items currently on MetaBid:", len(items))

          # ------------------------------------------
          # Compare MetaBid against SharePoint
          # ------------------------------------------

          removed_ids = []
          remaining_items = []

          for item in items:

              # Support both id and SharePoint ID naming
              item_id = str(
                  item.get(
                      "id",
                      item.get("ID", "")
                  )
              ).strip()

              if not item_id:
                  print("WARNING: Item has no ID:", item)
                  remaining_items.append(item)
                  continue

              if item_id in current_ids:
                  remaining_items.append(item)
              else:
                  removed_ids.append(item_id)

          print("IDs to remove:", removed_ids)
          print("Items remaining:", len(remaining_items))

          # ------------------------------------------
          # Nothing deleted
          # ------------------------------------------

          if not removed_ids:
              print("No deleted SharePoint items found.")
              raise SystemExit(0)

          # ------------------------------------------
          # Save cleaned inventory
          # ------------------------------------------

          data_file.write_text(
              json.dumps(
                  remaining_items,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          # ------------------------------------------
          # Delete images belonging to deleted items
          # ------------------------------------------

          image_folder = Path("images")

          if image_folder.exists():

              for item_id in removed_ids:

                  for image in image_folder.glob(
                      f"{item_id}.*"
                  ):
                      print("Deleting image:", image)
                      image.unlink()

          print("MetaBid cleanup complete.")

          PY

      - name: Commit cleanup
        run: |
          git config user.name "MetaBid Automation"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo "GitHub already matches SharePoint."
          else
            git commit -m "Sync MetaBid deletions from SharePoint"
            git push
          fi
